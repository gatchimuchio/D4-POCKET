name: Linux Rust manual validation

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-rust-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 対象commitを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: 対象とLinux環境を記録
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$head" = "$GITHUB_SHA"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          printf 'commit=%s\nref=%s\nrunner_os=%s\nimage=%s\n' \
            "$head" "$GITHUB_REF" "$RUNNER_OS" "$ImageOS/$ImageVersion" \
            | tee "$RUNNER_TEMP/d4p-linux-rust-environment.txt"
          rustc +1.95.0 --version | tee -a "$RUNNER_TEMP/d4p-linux-rust-environment.txt"
          cargo +1.95.0 --version | tee -a "$RUNNER_TEMP/d4p-linux-rust-environment.txt"
          target_dir="$RUNNER_TEMP/d4p-linux-cargo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          owner_data_home="$HOME/.local/share/d4p-linux-owner-xdg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$target_dir"
          test ! -e "$owner_data_home"
          test ! -L "$HOME/.local"
          test ! -L "$HOME/.local/share"
          mkdir -p "$HOME/.local/share"
          mkdir -m 0700 "$owner_data_home"
          printf 'CARGO_TARGET_DIR=%s\n' "$target_dir" >> "$GITHUB_ENV"
          printf 'XDG_DATA_HOME=%s\n' "$owner_data_home" >> "$GITHUB_ENV"
          {
            printf '\n- Commit: `%s`\n' "$head"
            printf -- '- Runner image: `%s/%s`\n' "$ImageOS" "$ImageVersion"
            printf -- '- Rust: `%s`\n' "$(rustc +1.95.0 --version)"
            printf -- '- Scope: Linux compile/test supplement; not native installed-product acceptance.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Linux変更範囲を含むRust整形
        shell: bash
        run: rustfmt +1.95.0 --edition 2021 --check --config skip_children=true native/rust_helper/src/bin/gui_shell_desktop_launcher.rs native/rust_helper/src/bin/gui_shell_linux_broker.rs native/rust_helper/src/adapters/process_tree.rs native/rust_helper/src/process_group_guardian.rs native/rust_helper/src/broker/product_install.rs native/rust_helper/src/broker/protocol.rs native/rust_helper/src/broker/update_center.rs native/rust_helper/src/desktop_launcher.rs native/rust_helper/src/linux_desktop_launcher.rs native/rust_helper/src/linux_desktop_worker.rs native/rust_helper/src/linux_product_bundle.rs native/rust_helper/src/macos_desktop_owner.rs native/rust_helper/src/product_bootstrapper.rs native/rust_helper/tests/fixtures/fake_codex_cli.rs
      - name: Linux product install path tests
        shell: bash
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib broker::product_install::tests -- --test-threads=1
      - name: Linux versioned product bootstrapper tests
        shell: bash
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib product_bootstrapper::tests -- --test-threads=1
      - name: Linux Broker native Owner stage activation rollback test
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib broker::update_center::tests::linux_native_owner_apply_activate_and_rollback_signed_packages -- --exact --test-threads=1
      - name: Linux native Owner confirmation binding test
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib macos_desktop_owner::task_owner_tests::linux_update_apply_uses_current_broker_listing_and_native_owner_confirmation -- --exact --test-threads=1
      - name: Linux native Owner rollback confirmation binding test
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib macos_desktop_owner::task_owner_tests::linux_update_rollback_confirmation_binds_both_signed_versions_and_fixed_entry -- --exact --test-threads=1
      - name: Linux native product launch Repair Broker and Owner tests
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib linux_product_launch_repair -- --test-threads=1
      - name: Linux product uninstall tests
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib uninstall_ -- --test-threads=1
      - name: Linux Codex CLI and sandbox capability
        id: codex_sandbox
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes bubblewrap
          fi
          bwrap --version
          package_dir="$RUNNER_TEMP/d4p-codex-cli-0.163.0-alpha.10.2-linux-x64"
          test ! -e "$package_dir"
          mkdir -m 0700 "$package_dir"
          curl --fail --location --output "$package_dir/package.tgz" https://registry.npmjs.org/@openai/codex/-/codex-0.163.0-alpha.10.2-linux-x64.tgz
          digest="$(openssl dgst -sha512 -binary "$package_dir/package.tgz" | openssl base64 -A)"
          test "$digest" = 'S3Om6e/GIhhheqWmc/aRCGM55ibvhnpYKq1gJ4bwCYeCNEtXEd7+L8xa5aX+JVmV0wL1oOFZi/R/R8iSLriHTA=='
          tar -xzf "$package_dir/package.tgz" -C "$package_dir"
          cli="$(find "$package_dir/package" -type f -name codex -print -quit)"
          test -n "$cli" && test -f "$cli"
          chmod 0700 "$cli"
          printf 'GUI_SHELL_CODEX_PROVIDER_AUTH_TEST_EXE=%s\n' "$cli" >> "$GITHUB_ENV"
          {
            "$cli" --version
            sha256sum "$cli"
            "$cli" exec --help
          } > "$RUNNER_TEMP/d4p-linux-codex-cli-interface.txt"
          cat "$RUNNER_TEMP/d4p-linux-codex-cli-interface.txt"
          probe_log="$RUNNER_TEMP/d4p-linux-bwrap-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          test ! -e "$probe_log"
          if bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent --ro-bind / / --dev /dev --proc /proc -- /bin/true >"$probe_log" 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            cat "$probe_log"
            if grep -Fq 'bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted' "$probe_log"; then
              echo 'available=false' >> "$GITHUB_OUTPUT"
              printf '\n- Codex LIVE_RUNTIME: NOT_RUN; hosted runner denies bubblewrap network-namespace loopback setup. The local WSL LIVE_RUNTIME result is recorded separately.\n' >> "$GITHUB_STEP_SUMMARY"
            else
              exit 1
            fi
          fi
      - name: Linux fake Codex Task, deadline and descendant cleanup
        shell: bash
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib adapters::codex_cli::tests::偽CodexCLIはAdapterのTask成功・期限超過cleanup・子孫停止を通る -- --exact --test-threads=1
      - name: Linux Broker crash guardian process-group recovery
        shell: bash
        run: 'cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib adapters::process_tree::unix_tests:: -- --test-threads=1'
      - name: Linux Broker crash recovers Codex descendant, Task scratch and durable Audit
        shell: bash
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib broker::protocol::tests::broker_crash_stops_codex_descendant_then_registration_recovers_task_scratch_and_audit -- --exact --test-threads=1
      - name: Linux Task permission profile stays platform-bounded
        shell: bash
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib adapters::codex_cli::tests::Dialogueはread_onlyのままTaskだけ専用permission_profileを使う -- --exact --test-threads=1
      - name: Normal Linux Release metadata remains unsupported before acceptance
        shell: bash
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib adapters::codex_cli::tests::Agent一覧の投影はread_only状態と秘密値非保持を表す -- --exact --test-threads=1
      - name: Linux real Codex sandbox and synthetic credential boundary
        if: steps.codex_sandbox.outputs.available == 'true'
        shell: bash
        env:
          RUST_BACKTRACE: "0"
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib adapters::codex_cli::tests::Provider資格情報は実CodexCLIへ届きtool子processから除外される_LIVE_RUNTIME -- --exact --ignored --test-threads=1
      - name: Broker validates candidate-bound package source for Owner display
        shell: bash
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib broker::update_center::tests::package_source_host_is_https_and_bound_to_the_candidate -- --exact --test-threads=1
      - name: Linux embedded product identity tests
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib broker::update_center::tests::embedded_product_identity_requires_a_complete_valid_compile_time_pair -- --exact --test-threads=1
      - name: Linux embedded product identity readback
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib broker::update_center::tests::linux_embedded_product_identity_uses_compile_time_values -- --exact --test-threads=1
      - name: Linux Rust all-target compile
        shell: bash
        run: cargo +1.95.0 check --locked --all-targets --manifest-path native/rust_helper/Cargo.toml
      - name: Temporary target cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected_target_dir="$RUNNER_TEMP/d4p-linux-cargo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ "${CARGO_TARGET_DIR:-}" != "$expected_target_dir" ]; then
            echo '一時target pathがこのrunの正確な所有pathではない'
            exit 1
          fi
          if [ -L "$CARGO_TARGET_DIR" ]; then
            echo '一時target rootがsymlink'; exit 1
          fi
          if [ -e "$CARGO_TARGET_DIR" ]; then
            rm -rf -- "$CARGO_TARGET_DIR"
          fi
          test ! -e "$CARGO_TARGET_DIR"
          expected_owner_data_home="$HOME/.local/share/d4p-linux-owner-xdg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ "${XDG_DATA_HOME:-}" != "$expected_owner_data_home" ]; then
            echo '一時XDG_DATA_HOMEがこのrunの正確な所有pathではない'
            exit 1
          fi
          if [ -L "$XDG_DATA_HOME" ]; then
            echo '一時XDG_DATA_HOME rootがsymlink'; exit 1
          fi
          if [ -e "$XDG_DATA_HOME" ]; then
            rm -rf -- "$XDG_DATA_HOME"
          fi
          test ! -e "$XDG_DATA_HOME"
          expected_codex_package_dir="$RUNNER_TEMP/d4p-codex-cli-0.163.0-alpha.10.2-linux-x64"
          if [ -e "$expected_codex_package_dir" ]; then
            if [ -L "$expected_codex_package_dir" ]; then
              echo '一時Codex package rootがsymlink'; exit 1
            fi
            rm -rf -- "$expected_codex_package_dir"
          fi
          test ! -e "$expected_codex_package_dir"
          rm -f -- "$RUNNER_TEMP/d4p-linux-codex-cli-interface.txt"
          test ! -e "$RUNNER_TEMP/d4p-linux-codex-cli-interface.txt"
          probe_log="$RUNNER_TEMP/d4p-linux-bwrap-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          rm -f -- "$probe_log"
          test ! -e "$probe_log"
