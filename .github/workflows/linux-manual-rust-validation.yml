name: Linux Rust manual validation

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-rust-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 対象commitを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: 対象とLinux環境を記録
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$head" = "$GITHUB_SHA"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          printf 'commit=%s\nref=%s\nrunner_os=%s\nimage=%s\n' \
            "$head" "$GITHUB_REF" "$RUNNER_OS" "$ImageOS/$ImageVersion" \
            | tee "$RUNNER_TEMP/d4p-linux-rust-environment.txt"
          rustc +1.95.0 --version | tee -a "$RUNNER_TEMP/d4p-linux-rust-environment.txt"
          cargo +1.95.0 --version | tee -a "$RUNNER_TEMP/d4p-linux-rust-environment.txt"
          target_dir="$RUNNER_TEMP/d4p-linux-cargo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$target_dir"
          printf 'CARGO_TARGET_DIR=%s\n' "$target_dir" >> "$GITHUB_ENV"
          {
            printf '\n- Commit: `%s`\n' "$head"
            printf -- '- Runner image: `%s/%s`\n' "$ImageOS" "$ImageVersion"
            printf -- '- Rust: `%s`\n' "$(rustc +1.95.0 --version)"
            printf -- '- Scope: Linux compile/test supplement; not native installed-product acceptance.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Linux変更範囲を含むRust整形
        shell: bash
        run: rustfmt +1.95.0 --edition 2021 --check native/rust_helper/src/bin/gui_shell_desktop_launcher.rs native/rust_helper/src/broker/product_install.rs native/rust_helper/src/broker/update_center.rs native/rust_helper/src/linux_desktop_launcher.rs native/rust_helper/src/linux_desktop_worker.rs native/rust_helper/src/linux_product_bundle.rs native/rust_helper/src/macos_desktop_owner.rs native/rust_helper/src/product_bootstrapper.rs
      - name: Linux product install path tests
        shell: bash
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib broker::product_install::tests -- --test-threads=1
      - name: Linux versioned product bootstrapper tests
        shell: bash
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib product_bootstrapper::tests -- --test-threads=1
      - name: Linux Broker native Owner stage activation rollback test
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib broker::update_center::tests::linux_native_owner_apply_activate_and_rollback_signed_packages -- --exact --test-threads=1
      - name: Linux native Owner confirmation binding test
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib macos_desktop_owner::task_owner_tests::linux_update_apply_uses_current_broker_listing_and_native_owner_confirmation -- --exact --test-threads=1
      - name: Linux native Owner rollback confirmation binding test
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib macos_desktop_owner::task_owner_tests::linux_update_rollback_confirmation_binds_both_signed_versions_and_fixed_entry -- --exact --test-threads=1
      - name: Broker validates candidate-bound package source for Owner display
        shell: bash
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib broker::update_center::tests::package_source_host_is_https_and_bound_to_the_candidate -- --exact --test-threads=1
      - name: Linux embedded product identity tests
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib broker::update_center::tests::embedded_product_identity_requires_a_complete_valid_compile_time_pair -- --exact --test-threads=1
      - name: Linux embedded product identity readback
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
        run: cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib broker::update_center::tests::linux_embedded_product_identity_uses_compile_time_values -- --exact --test-threads=1
      - name: Linux Rust all-target compile
        shell: bash
        run: cargo +1.95.0 check --locked --all-targets --manifest-path native/rust_helper/Cargo.toml
      - name: Temporary target cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected_target_dir="$RUNNER_TEMP/d4p-linux-cargo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ "${CARGO_TARGET_DIR:-}" != "$expected_target_dir" ]; then
            echo '一時target pathがこのrunの正確な所有pathではない'
            exit 1
          fi
          if [ -L "$CARGO_TARGET_DIR" ]; then
            echo '一時target rootがsymlink'; exit 1
          fi
          if [ -e "$CARGO_TARGET_DIR" ]; then
            rm -rf -- "$CARGO_TARGET_DIR"
          fi
          test ! -e "$CARGO_TARGET_DIR"
