name: Windows GUI Shell Export bundle manual validation

'on': workflow_dispatch

permissions:
  contents: read

concurrency:
  group: windows-export-build-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: 対象commitを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: mainの固定commitとclean状態を確認
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Export buildはmainからだけ起動できる: $env:GITHUB_REF"
          }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) {
            throw "checkout HEAD ($head) does not match workflow commit ($env:GITHUB_SHA)"
          }
          $remoteMain = (git rev-parse refs/remotes/origin/main).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'checkoutしたorigin/mainを解決できない' }
          if ($remoteMain -ne $head) {
            throw "origin/main ($remoteMain) does not match workflow commit ($head)"
          }
          $branch = (git branch --show-current).Trim()
          if ($branch -eq '') {
            git switch --create main $head
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($branch -ne 'main') {
            throw "Export build checkout must be main: $branch"
          }
          $changes = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -gt 0) {
            $changes | Write-Output
            throw 'Export build source must be clean'
          }
          @(
            "source_commit=$head"
            "source_ref=$env:GITHUB_REF"
            "remote_main=$remoteMain"
            "runner_os=$env:RUNNER_OS"
            "runner_image=$env:ImageOS/$env:ImageVersion"
          ) | Tee-Object -FilePath "$env:RUNNER_TEMP\gui-shell-export-environment.txt"
          @(
            '# Windows Export bundle build (manual validation)'
            "- Source commit: ``$head`` (verified against `GITHUB_SHA` and `origin/main`)."
            "- Runner: ``$env:ImageOS/$env:ImageVersion``."
            '- Input scope: checked-in synthetic Receipt and Manifest fixtures; no Broker or Owner authority was exercised.'
            '- Result scope: Windows Release fixture bundle construction plus a separate portable launch/UI/Broker smoke; no artifact is uploaded.'
            '- The launch smoke does not establish Owner authorization, installed-product behavior, signing, installer, update/rollback, full binary pruning, or release readiness.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: 固定RustとFlutter toolchainを用意
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.95.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustcVersion = (rustc --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargoVersion = (cargo --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $rustcVersion.StartsWith('rustc 1.95.0 ') -or -not $cargoVersion.StartsWith('cargo 1.95.0 ')) {
            throw "unexpected Rust toolchain: $rustcVersion / $cargoVersion"
          }
          $flutterRoot = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git $flutterRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $flutterCommit = (git -C $flutterRoot rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $flutterCommit -ne '559ffa3f75e7402d65a8def9c28389a9b2e6fe42') {
            throw "Flutter checkout mismatch: $flutterCommit"
          }
          "$flutterRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          @(
            "GUI_SHELL_EXPORT_RUSTC_VERSION=$rustcVersion"
            "GUI_SHELL_EXPORT_CARGO_VERSION=$cargoVersion"
            "GUI_SHELL_EXPORT_FLUTTER_COMMIT=$flutterCommit"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "$flutterRoot\bin\flutter.bat" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: fixtureから未署名Windows Release bundleを構築・検証
        id: portable_export_build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_TEMP.Contains('~')) {
            throw "RUNNER_TEMP must not contain a DOS short-name marker: $env:RUNNER_TEMP"
          }
          $bundle = Join-Path $env:RUNNER_TEMP 'd4-pocket-export-fixture'
          if (Test-Path -LiteralPath $bundle) {
            throw 'fixture bundle output already exists; refusing overwrite'
          }
          $receiptPath = Join-Path $env:GITHUB_WORKSPACE 'examples/contracts/gui_shell_export_receipt.valid.json'
          $manifestFixturePath = Join-Path $env:GITHUB_WORKSPACE 'examples/contracts/gui_shell_export_manifest.valid.json'
          $receiptFixture = Get-Content -LiteralPath $receiptPath -Raw -Encoding utf8 | ConvertFrom-Json
          $manifestFileName = [string]$receiptFixture.manifest_file.file_name
          if ($manifestFileName -notmatch '^d4-pocket-app-[0-9a-f]{32}\.json$') {
            throw 'fixture Receipt contains an unexpected Manifest filename'
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP $manifestFileName
          if (Test-Path -LiteralPath $manifestPath) {
            throw 'fixture Manifest staging path already exists; refusing overwrite'
          }
          Copy-Item -LiteralPath $manifestFixturePath -Destination $manifestPath
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          Remove-Item Env:GH_TOKEN
          $basic = $null
          python -X utf8 tooling/export_windows_product.py `
            --receipt $receiptPath `
            --manifest-file $manifestPath `
            --output-dir $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @(
              'GH_TOKEN', 'GITHUB_TOKEN', 'GIT_CONFIG_COUNT', 'GIT_CONFIG_KEY_0', 'GIT_CONFIG_VALUE_0',
              'ACTIONS_RUNTIME_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
            )) {
            Remove-Item -LiteralPath "Env:$name" -ErrorAction SilentlyContinue
          }
          $evidencePath = Join-Path $bundle 'd4_pocket_build_receipt.json'
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            throw 'validated build evidence is missing'
          }
          $evidence = Get-Content -LiteralPath $evidencePath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($evidence.evidence_type -ne 'd4_pocket_windows_export_build' -or
              $evidence.source_commit -ne $env:GITHUB_SHA -or
              $evidence.portable_bundle_assembled -ne $true -or
              $evidence.formal_distribution_claimed -ne $false -or
              $evidence.standalone_app_verified -ne $false -or
              $evidence.signed -ne $false -or
              $evidence.installer_status -ne 'not_started' -or
              $evidence.launch_status -ne 'not_verified') {
            throw 'build evidence scope or source identity is unexpected'
          }
          if ($evidence.credential_artifact_scan.status -ne 'passed_known_patterns' -or
              $evidence.credential_artifact_scan.findings -ne 0 -or
              $evidence.artifact_tree_sha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'bounded artifact scan or inventory evidence is invalid'
          }
          $launchEvidencePath = Join-Path $env:RUNNER_TEMP 'd4-pocket-export-launch-smoke.json'
          if (Test-Path -LiteralPath $launchEvidencePath) {
            throw 'portable launch evidence path already exists; refusing overwrite'
          }
          & pwsh -NoLogo -NoProfile -File tooling/tests/windows_export_portable_launch_smoke.ps1 `
            -BundlePath $bundle `
            -EvidencePath $launchEvidencePath `
            -SourceCommit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $launchEvidencePath -PathType Leaf)) {
            throw 'portable launch evidence was not produced'
          }
          $launchEvidence = Get-Content -LiteralPath $launchEvidencePath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($launchEvidence.result -ne 'passed' -or
              $launchEvidence.evidence_class -ne 'LIVE_RUNTIME' -or
              $launchEvidence.frontend.ui_observation_status -ne 'passed' -or
              $launchEvidence.source_commit -ne $env:GITHUB_SHA -or
              $launchEvidence.broker.selected_trace_operation_status -ne 'accepted' -or
              [string]::IsNullOrWhiteSpace([string]$launchEvidence.broker.selected_trace_operation_audit_id) -or
              $launchEvidence.broker.selected_trace_operation_authority_absent -ne $true -or
              $launchEvidence.frontend.trace_inspector_ui_status -ne 'passed' -or
              [int]$launchEvidence.frontend.trace_inspector_span_count -lt 1 -or
              $launchEvidence.frontend.trace_inspector_selected_operation_visible -ne $true -or
              $launchEvidence.broker.audit_validation.selected_trace_event_id_bound -ne $true -or
              $launchEvidence.broker.excluded_operation_status -ne 'rejected' -or
              $launchEvidence.broker.excluded_operation_code -ne 'optional_module_not_included' -or
              $launchEvidence.broker.generic_command_status -ne 'suspended' -or
              $launchEvidence.broker.generic_command_code -ne 'broker_command_dispatch_disabled' -or
              $launchEvidence.frontend.launcher_argument_rejected -ne $true -or
              $launchEvidence.frontend.unexpected_frontend_spawned -ne $false -or
              $launchEvidence.frontend.graceful_exit -ne $true -or
              $launchEvidence.cleanup.endpoint_removed -ne $true -or
              $launchEvidence.cleanup.runtime_fixture_removed -ne $true -or
              $launchEvidence.scope.installed_product_verified -ne $false -or
              $launchEvidence.scope.binary_pruning_verified -ne $false) {
            throw 'portable launch evidence status, authority boundary, or cleanup is invalid'
          }
          $portableZip = Join-Path $env:RUNNER_TEMP 'D4-Pocket-portable-fixture.zip'
          if (Test-Path -LiteralPath $portableZip) {
            throw 'portable ZIP output already exists; refusing overwrite'
          }
          $zipSummaryLines = python -X utf8 tooling/package_windows_portable.py `
            --source-dir $bundle `
            --output $portableZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zipSummary = ($zipSummaryLines -join "`n") | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $portableZip -PathType Leaf) -or
              $zipSummary.portable_zip_created -ne $true -or
              $zipSummary.source_commit -ne $env:GITHUB_SHA -or
              $zipSummary.signed -ne $false -or
              $zipSummary.formal_distribution_claimed -ne $false -or
              $zipSummary.standalone_app_verified -ne $false) {
            throw 'portable ZIP evidence scope or source identity is unexpected'
          }
          $zipHash = (Get-FileHash -LiteralPath $portableZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne $zipSummary.archive_sha256) {
            throw 'portable ZIP SHA-256 does not match the packager receipt'
          }
          @(
            "- Rust: ``$env:GUI_SHELL_EXPORT_RUSTC_VERSION`` / ``$env:GUI_SHELL_EXPORT_CARGO_VERSION``."
            "- Flutter commit: ``$env:GUI_SHELL_EXPORT_FLUTTER_COMMIT``; framework: ``$($evidence.toolchain.flutter)``; Dart: ``$($evidence.toolchain.dart)``."
            "- Export build: ``passed``; evidence source: ``INTERNAL_STATE``; fixture input only."
            "- Artifact inventory: ``$($evidence.artifact_files.Count)`` files, ``$($evidence.artifact_total_bytes)`` bytes, tree SHA-256 ``$($evidence.artifact_tree_sha256)``."
            "- Separate launch smoke: ``$($launchEvidence.result)`` / ``$($launchEvidence.evidence_class)`` on ``$($launchEvidence.runner_image)``; launcher PID ``$($launchEvidence.frontend.launcher_pid)``, Flutter child PID ``$($launchEvidence.frontend.process_id)``; selected UI labels ``$($launchEvidence.frontend.included_surfaces -join ', ')``; excluded UI labels absent: ``$($launchEvidence.frontend.excluded_surfaces_absent)``."
            "- Selected Trace Inspector Broker call: ``$($launchEvidence.broker.selected_trace_operation_status)``; Audit ID ``$($launchEvidence.broker.selected_trace_operation_audit_id)``; authority absent ``$($launchEvidence.broker.selected_trace_operation_authority_absent)``; Audit event bound ``$($launchEvidence.broker.audit_validation.selected_trace_event_id_bound)``."
            "- Flutter Trace Inspector consumer: ``$($launchEvidence.frontend.trace_inspector_ui_status)``; rendered spans ``$($launchEvidence.frontend.trace_inspector_span_count)``; selected positive operation visible ``$($launchEvidence.frontend.trace_inspector_selected_operation_visible)``."
            "- Launcher argument refusal: ``$($launchEvidence.frontend.launcher_argument_rejected)`` / ``$($launchEvidence.frontend.launcher_argument_error_code)``; unexpected Flutter child: ``$($launchEvidence.frontend.unexpected_frontend_spawned)``."
            "- Authenticated Broker: excluded Setup Doctor request ``$($launchEvidence.broker.excluded_operation_status)`` / ``$($launchEvidence.broker.excluded_operation_code)``; generic command ``$($launchEvidence.broker.generic_command_status)`` / ``$($launchEvidence.broker.generic_command_code)``; both have Audit IDs and no private marker or session secret exposure."
            "- Native tray exit and runtime fixture cleanup: attempted ``$($launchEvidence.frontend.graceful_exit_attempted)``; graceful ``$($launchEvidence.frontend.graceful_exit)``; endpoint removed ``$($launchEvidence.cleanup.endpoint_removed)``; isolated runtime store removed ``$($launchEvidence.cleanup.runtime_fixture_removed)``; Audit SHA-256 ``$($launchEvidence.broker.audit_sha256)`` (``$($launchEvidence.broker.audit_bytes)`` bytes)."
            "- Audit validation: selected event ID ``$($launchEvidence.broker.audit_validation.selected_trace_event_id_bound)``; excluded event ID ``$($launchEvidence.broker.audit_validation.excluded_event_id_bound)``; exclusion code ``$($launchEvidence.broker.audit_validation.excluded_operation_code_bound)``; command event ID ``$($launchEvidence.broker.audit_validation.command_event_id_bound)``; private marker absent ``$($launchEvidence.broker.audit_validation.private_marker_absent)``; command marker absent ``$($launchEvidence.broker.audit_validation.command_marker_absent)``; session secret absent ``$($launchEvidence.broker.audit_validation.session_secret_absent)``."
            "- Portable ZIP: ``passed``; entries: ``$($zipSummary.file_count)``; compressed bytes: ``$($zipSummary.archive_bytes)``; SHA-256: ``$zipHash``."
            '- Credential scan: zero findings for the implemented known-pattern set only; not proof of general credential absence.'
            '- Build receipt remains ``standalone_app_verified=false``, ``launch_status=not_verified``, ``binary_pruning_verified=false``; the separate smoke is not an installed-product, full pruning, Owner-authorization, signing, or distribution claim.'
            '- Signed: no; installer: not started; formal distribution claimed: no.'
            '- The separate smoke evidence, ZIP, bundle, and staged fixture Manifest remain only in the ephemeral runner workspace and are removed with the job; no artifact upload occurs.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          foreach ($path in @($portableZip, $bundle, $manifestPath, $launchEvidencePath)) {
            $resolved = [IO.Path]::GetFullPath($path)
            $runnerRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
            if (-not $resolved.StartsWith($runnerRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw "temporary Export output escaped RUNNER_TEMP: $resolved"
            }
            if (Test-Path -LiteralPath $resolved) {
              Remove-Item -LiteralPath $resolved -Recurse -Force
            }
          }
      - name: portable launch smokeの結果とcleanupを常時要約
        if: always() && steps.portable_export_build.outcome != 'success'
        env:
          EXPORT_BUILD_OUTCOME: ${{ steps.portable_export_build.outcome }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = Join-Path $env:RUNNER_TEMP 'd4-pocket-export-launch-smoke.json'
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            $lines = @(
              '### Windows Export portable launch smoke'
              '- Result: `NOT_ESTABLISHED`; evidence JSON was not produced before the build/export step stopped.'
            )
            $lines | Write-Output
            $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          try {
            $evidence = Get-Content -LiteralPath $evidencePath -Raw -Encoding utf8 | ConvertFrom-Json -ErrorAction Stop
          } catch {
            '### Windows Export portable launch smoke' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '- Result: `NOT_ESTABLISHED`; evidence JSON could not be parsed.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw 'portable launch evidence JSON is invalid'
          }
          if ($evidence.evidence_type -ne 'd4_pocket_windows_portable_launch_smoke' -or
              $evidence.source_commit -ne $env:GITHUB_SHA) {
            throw 'portable launch evidence type or source identity is invalid'
          }
          $uiStatus = if ($null -eq $evidence.frontend.ui_observation_status) { 'NOT_ESTABLISHED' } else { [string]$evidence.frontend.ui_observation_status }
          $uiStage = if ([string]::IsNullOrWhiteSpace([string]$evidence.frontend.ui_observation_failure_stage)) { 'none' } else { [string]$evidence.frontend.ui_observation_failure_stage }
          $uiLabels = @($evidence.frontend.ui_observation_known_labels) -join ', '
          if ([string]::IsNullOrWhiteSpace($uiLabels)) { $uiLabels = 'none' }
          $auditHash = if ([string]$evidence.broker.audit_sha256 -match '^sha256:[0-9a-f]{64}$') { [string]$evidence.broker.audit_sha256 } else { 'not_observed' }
          $failureStage = if ([string]::IsNullOrWhiteSpace([string]$evidence.failure_stage)) { 'none' } else { [string]$evidence.failure_stage }
          $lines = @(
            '### Windows Export portable launch smoke'
            "- Export-build step outcome: ``$env:EXPORT_BUILD_OUTCOME``."
            "- Result: ``$($evidence.result)`` / ``$($evidence.evidence_class)``; source ``$($evidence.source_commit)``; runner ``$($evidence.runner_image)``."
            "- UI Automation: ``$uiStatus``; stage ``$uiStage``; Control View nodes ``$($evidence.frontend.ui_observation_control_node_count)``; known labels ``$uiLabels``."
            "- Authenticated Broker: excluded operation ``$($evidence.broker.excluded_operation_status)`` / ``$($evidence.broker.excluded_operation_code)`` (Audit ``$($evidence.broker.excluded_operation_audit_id)``); generic command ``$($evidence.broker.generic_command_status)`` / ``$($evidence.broker.generic_command_code)`` (Audit ``$($evidence.broker.generic_command_audit_id)``)."
            "- Exit/cleanup: tray attempted ``$($evidence.frontend.graceful_exit_attempted)``; callback posted ``$($evidence.frontend.tray_exit_callback_posted)``; popup observed ``$($evidence.frontend.tray_popup_window_observed)``; exit item observed ``$($evidence.frontend.tray_exit_item_observed)``; exit item invoked ``$($evidence.frontend.tray_exit_item_invoked)``; guarded keyboard fallback attempted/sent ``$($evidence.frontend.tray_keyboard_fallback_attempted)``/``$($evidence.frontend.tray_keyboard_fallback_sent)``; graceful ``$($evidence.frontend.graceful_exit)``; frontend forced ``$($evidence.frontend.forced_exit)``; launcher forced ``$($evidence.cleanup.launcher_forced_exit)``; endpoint removed ``$($evidence.cleanup.endpoint_removed)``; runtime fixture removed ``$($evidence.cleanup.runtime_fixture_removed)``."
            "- Audit validation: file observed ``$($evidence.broker.audit_validation.file_observed)``; excluded event ID ``$($evidence.broker.audit_validation.excluded_event_id_bound)``; exclusion code ``$($evidence.broker.audit_validation.excluded_operation_code_bound)``; command event ID ``$($evidence.broker.audit_validation.command_event_id_bound)``; private marker absent ``$($evidence.broker.audit_validation.private_marker_absent)``; command marker absent ``$($evidence.broker.audit_validation.command_marker_absent)``; session secret absent ``$($evidence.broker.audit_validation.session_secret_absent)``."
            "- Audit: SHA-256 ``$auditHash``; bytes ``$($evidence.broker.audit_bytes)``; final failure stage ``$failureStage``."
            '- Summary omits request payloads, private markers, session secrets, and raw exception text.'
          )
          $lines | Write-Output
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: source working treeがcleanなことを確認
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changes = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes.Count -gt 0) {
            $changes | Write-Output
            throw 'Export build modified the checked-out source tree'
          }
