name: Apple platform 手動補助build

'on':
  workflow_dispatch:
    inputs:
      target:
        description: 実行する検証範囲
        type: choice
        options:
          - all
          - ios_mobile
          - ios_product_ui
          - macos_product
          - macos_owner
          - macos_adapter_lifecycle
          - macos_agent_registration
          - macos_workspace_selection
          - macos_agent_cli_selection
          - macos_credential_vault
        default: all
        required: true

permissions:
  contents: read

jobs:
  macos-credential:
    if: ${{ inputs.target == 'macos_credential_vault' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: 対象commitを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Keychain実APIとBroker保存先を検証
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          { git rev-parse HEAD; sw_vers; xcodebuild -version; } > evidence/environment.txt
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib credential_storage::tests:: -- --test-threads=1 2>&1 | tee evidence/keychain-runtime-test.txt
          cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib macos_credential_registration_is_bound_to_real_desktop_owner_gate -- --test-threads=1 2>&1 | tee evidence/credential-owner-gate-test.txt
      - name: 秘密入力の固定native境界と製品build
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          cargo +1.95.0 test --locked --manifest-path native/macos_owner/Cargo.toml --lib credential_input::tests:: 2>&1 | tee evidence/native-input-boundary-test.txt
          cargo +1.95.0 build --locked --manifest-path native/rust_helper/Cargo.toml --bin gui_shell_macos_broker 2>&1 | tee evidence/broker-build.txt
          cargo +1.95.0 build --locked --manifest-path native/macos_owner/Cargo.toml --lib --features credential-ui-fixture 2>&1 | tee evidence/native-fixture-build.txt
          cd apps/desktop_flutter
          flutter pub get 2>&1 | tee ../../evidence/pub-get.txt
          dart analyze lib/services/broker_client.dart lib/services/mcp_connection_client.dart lib/screens/mcp_connection_center.dart test/macos_credential_vault_test.dart test/mcp_connection_center_test.dart 2>&1 | tee ../../evidence/dart-analyze.txt
          flutter test --no-pub test/macos_credential_vault_test.dart 2>&1 | tee ../../evidence/flutter-credential-test.txt
          flutter test --no-pub test/mcp_connection_center_test.dart --plain-name 'Desktop panelのCredential失効は選択metadataをBrokerへ送り一覧を更新する' 2>&1 | tee ../../evidence/flutter-credential-revoke-test.txt
          flutter build macos --debug --no-pub 2>&1 | tee ../../evidence/macos-build.txt
          cd ../..
          xcodebuild test -project apps/desktop_flutter/macos/Runner.xcodeproj -scheme Runner \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -only-testing:RunnerUITests/AdapterOwnerUITests/testProductCredentialVault \
            -derivedDataPath "$RUNNER_TEMP/macos-credential-tests" -resultBundlePath "$RUNNER_TEMP/macos-credential-tests.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG D4_MACOS_OWNER_UI_TEST' 2>&1 | tee evidence/credential-product-ui-test.txt
          cargo +1.95.0 build --locked --manifest-path native/macos_owner/Cargo.toml --lib 2>&1 | tee evidence/native-normal-build.txt
          cd apps/desktop_flutter
          flutter build macos --debug --no-pub 2>&1 | tee ../../evidence/macos-normal-build.txt
      - name: 有限結果と後片付け
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          credential_audit=/Users/runner/Library/Containers/com.example.guiShellDesktop/Data/Library/Application\ Support/D4Pocket/macos-broker/store/audit.jsonl
          if [ -f "$credential_audit" ] && [ ! -L "$credential_audit" ]; then
            test "$(stat -f%z "$credential_audit")" -lt 4194304
            # 拒否原因の診断だけ。秘密・record本文・hash・IDをartifactへ出さない。
            jq -sc 'map(select(.operation == "資格情報登録" or .operation == "資格情報一覧" or .operation == "資格情報失効")) | .[-64:][] | {operation: .operation, decision: (if .decision == "received" or .decision == "accepted" or .decision == "rejected" or .decision == "suspended" then .decision else "unknown" end), code: (if (.reason | test("^(credential|broker|desktop_owner)_[a-z_]{1,64}$")) then .reason elif (.reason | startswith("資格情報記録:") or startswith("資格情報失効記録:")) then "metadata_recorded" else "other" end)}' "$credential_audit" > evidence/credential-native-code.jsonl
          fi
          if [ -d "$RUNNER_TEMP/macos-credential-tests.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/macos-credential-tests.xcresult" > evidence/native-summary.json
          fi
          if pgrep -x gui_shell_macos_broker > evidence/remaining-helper-pids.txt; then
            while read -r pid; do kill -TERM "$pid"; done < evidence/remaining-helper-pids.txt
            exit 1
          fi
          git diff --exit-code -- apps/desktop_flutter
      - name: 限定証拠を保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-credential-${{ github.sha }}
          path: evidence/
          retention-days: 3
          if-no-files-found: error
  macos-product:
    if: ${{ inputs.target == 'macos_product' || inputs.target == 'macos_owner' || inputs.target == 'macos_adapter_lifecycle' || inputs.target == 'macos_agent_registration' || inputs.target == 'macos_workspace_selection' || inputs.target == 'macos_agent_cli_selection' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 対象commitを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 固定toolchainと実行環境
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          { git rev-parse HEAD; sw_vers; xcodebuild -version; } | tee evidence/environment.txt
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.95.0 --profile minimal
      - name: 通常Broker接続のRust試験とbuild
        shell: bash
        run: |
          set -euo pipefail
          filter='macos_desktop_worker::tests::'
          if [ '${{ inputs.target }}' = 'macos_owner' ]; then
            filter='macos_desktop_worker::tests::owner_adapter_roundtrip'
            cargo +1.95.0 test --locked --manifest-path native/macos_owner/Cargo.toml 2>&1 | tee evidence/macos-owner-native.txt
          elif [ '${{ inputs.target }}' = 'macos_adapter_lifecycle' ]; then
            filter='macos_desktop_worker::tests::owner_adapter_lifecycle'
          elif [ '${{ inputs.target }}' = 'macos_agent_registration' ]; then
            filter='macos_desktop_worker::tests::owner_agent_registration_'
          elif [ '${{ inputs.target }}' = 'macos_workspace_selection' ]; then
            filter='macos_workspace_selection::tests::'
            cargo +1.95.0 test --locked --manifest-path native/macos_owner/Cargo.toml --lib workspace_transport::tests:: 2>&1 | tee evidence/workspace-native-boundary-test.txt
          elif [ '${{ inputs.target }}' = 'macos_agent_cli_selection' ]; then
            filter='macos_workspace_selection::tests::cli_selection_'
            cargo +1.95.0 test --locked --manifest-path native/macos_owner/Cargo.toml --lib workspace_transport::tests::cli_public_selection_ 2>&1 | tee evidence/cli-native-boundary-test.txt
          fi
          cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib "$filter" -- --test-threads=1 2>&1 | tee evidence/macos-rust-test.txt
          cargo +1.95.0 build --locked --manifest-path native/rust_helper/Cargo.toml --bin gui_shell_macos_broker 2>&1 | tee evidence/macos-rust-build.txt
          cargo +1.95.0 build --locked --manifest-path native/macos_owner/Cargo.toml --lib 2>&1 | tee evidence/macos-rust-ui-build.txt
      - name: 固定版実Codexとsandbox内の合成Workspaceを準備
        if: inputs.target == 'macos_agent_registration' || inputs.target == 'macos_workspace_selection' || inputs.target == 'macos_agent_cli_selection'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$HOME" = /Users/runner
          fixture="$HOME/Library/Containers/com.example.guiShellDesktop/Data/d4-registration-fixture"
          test ! -e "$fixture"
          mkdir -p "$fixture/workspace" "$RUNNER_TEMP/d4-codex-package"
          if [ '${{ inputs.target }}' = 'macos_workspace_selection' ]; then
            test ! -e /Users/runner/d4-os-selected-workspace
            mkdir /Users/runner/d4-os-selected-workspace
          fi
          curl --fail --location --output "$RUNNER_TEMP/d4-codex-package/package.tgz" https://registry.npmjs.org/@openai/codex/-/codex-0.159.2-darwin-arm64.tgz
          digest="$(openssl dgst -sha512 -binary "$RUNNER_TEMP/d4-codex-package/package.tgz" | openssl base64 -A)"
          test "$digest" = '7SPaPFU0tdqapQ5VEgrF+wb+p9dxfWfLMXMKZMRKoWPn/tLMajlMjYBBnu8o6VtaVH2DHQ6kpnp5TMkv5bqvrg=='
          tar -xzf "$RUNNER_TEMP/d4-codex-package/package.tgz" -C "$RUNNER_TEMP/d4-codex-package"
          cli="$(find "$RUNNER_TEMP/d4-codex-package/package" -type f -name codex)"
          test -f "$cli"
          cp "$cli" "$fixture/codex"
          chmod 755 "$fixture/codex"
          if [ '${{ inputs.target }}' = 'macos_agent_cli_selection' ]; then
            test ! -e /Users/runner/d4-os-selected-cli
            cp "$cli" /Users/runner/d4-os-selected-cli
            chmod 755 /Users/runner/d4-os-selected-cli
          fi
          { "$fixture/codex" --version; shasum -a 256 "$fixture/codex"; "$fixture/codex" exec --help; } > evidence/codex-registration-interface.txt
      - name: 同梱helper付きmacOS製品build
        working-directory: apps/desktop_flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee ../../evidence/desktop-pub-get.txt
          if [ '${{ inputs.target }}' = 'macos_adapter_lifecycle' ]; then
            dart analyze lib/services/broker_client.dart lib/services/shell_core_client.dart lib/screens/runtime_center.dart test/broker_client_payload_hash_test.dart test/widget_test.dart 2>&1 | tee ../../evidence/adapter-dart-analyze.txt
            flutter test --no-pub test/broker_client_payload_hash_test.dart --plain-name 'native Owner確認のBroker操作はFlutter待機時間を共有する' 2>&1 | tee ../../evidence/adapter-timeout-test.txt
            flutter test --no-pub test/widget_test.dart --plain-name '起動後のAdapter一覧に表示されたrecordを現在hashへ束縛して操作する' 2>&1 | tee ../../evidence/adapter-fresh-catalog-test.txt
          fi
          if [ '${{ inputs.target }}' = 'macos_agent_registration' ]; then
            dart analyze lib/services/broker_client.dart test/broker_client_payload_hash_test.dart 2>&1 | tee ../../evidence/registration-dart-analyze.txt
            flutter test --no-pub test/broker_client_payload_hash_test.dart 2>&1 | tee ../../evidence/registration-transport-test.txt
          fi
          if [ '${{ inputs.target }}' = 'macos_workspace_selection' ]; then
            dart analyze lib/services/broker_client.dart lib/screens/agent_center.dart test/broker_client_payload_hash_test.dart test/widget_test.dart 2>&1 | tee ../../evidence/workspace-dart-analyze.txt
            flutter test --no-pub test/broker_client_payload_hash_test.dart --plain-name 'OS選択はOwner承認集合を増やさず限定native待機を使う' 2>&1 | tee ../../evidence/workspace-timeout-test.txt
            flutter test --no-pub test/widget_test.dart --plain-name 'macOS作業領域OS選択は取消で入力保持し投影だけを反映する' 2>&1 | tee ../../evidence/workspace-projection-test.txt
          fi
          if [ '${{ inputs.target }}' = 'macos_agent_cli_selection' ]; then
            dart analyze lib/services/broker_client.dart lib/screens/agent_center.dart test/broker_client_payload_hash_test.dart test/widget_test.dart 2>&1 | tee ../../evidence/cli-dart-analyze.txt
            flutter test --no-pub test/broker_client_payload_hash_test.dart --plain-name 'CLI実行file OS選択は登録とは別の限定native待機を使う' 2>&1 | tee ../../evidence/cli-timeout-test.txt
            flutter test --no-pub test/widget_test.dart --plain-name 'macOS CLI実行fileのOS選択は入力だけへ投影し登録を開始しない' 2>&1 | tee ../../evidence/cli-projection-test.txt
          fi
          flutter build macos --debug --no-pub 2>&1 | tee ../../evidence/macos-build.txt
      - name: 製品bootstrapとBroker終了
        shell: bash
        run: |
          set -euo pipefail
          target=RunnerTests
          extra=()
          if [ '${{ inputs.target }}' = 'macos_owner' ]; then
            target=RunnerUITests/AdapterOwnerUITests/testProductAdapterOwnerDenialAndInstall
            extra=('SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG D4_MACOS_OWNER_UI_TEST')
          elif [ '${{ inputs.target }}' = 'macos_adapter_lifecycle' ]; then
            target=RunnerUITests/AdapterOwnerUITests/testProductAdapterLifecycle
            extra=('SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG D4_MACOS_OWNER_UI_TEST')
          elif [ '${{ inputs.target }}' = 'macos_agent_registration' ]; then
            target=RunnerUITests/AdapterOwnerUITests/testProductAgentRegistration
            extra=('SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG D4_MACOS_OWNER_UI_TEST')
          elif [ '${{ inputs.target }}' = 'macos_workspace_selection' ]; then
            target=RunnerUITests/AdapterOwnerUITests/testProductWorkspaceOSSelection
            extra=('SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG D4_MACOS_OWNER_UI_TEST')
          elif [ '${{ inputs.target }}' = 'macos_agent_cli_selection' ]; then
            target=RunnerUITests/AdapterOwnerUITests/testProductAgentCLIOSSelection
            extra=('SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG D4_MACOS_OWNER_UI_TEST')
          fi
          xcodebuild test -project apps/desktop_flutter/macos/Runner.xcodeproj -scheme Runner \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -only-testing:"$target" -derivedDataPath "$RUNNER_TEMP/macos-product-tests" \
            -resultBundlePath "$RUNNER_TEMP/macos-product-tests.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual "${extra[@]}" 2>&1 | tee evidence/macos-native-test.txt
      - name: 結果と後片付けを確認
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ inputs.target }}' = 'macos_workspace_selection' ]; then
            selection_audit=/Users/runner/Library/Containers/com.example.guiShellDesktop/Data/Library/Application\ Support/D4Pocket/macos-broker/store/audit.jsonl
            if [ -f "$selection_audit" ] && [ ! -L "$selection_audit" ]; then
              test "$(stat -f%z "$selection_audit")" -lt 4194304
              jq -c 'select(.operation == "作業領域OS選択") | {decision: (if .decision == "accepted" or .decision == "rejected" or .decision == "suspended" then .decision else "unknown" end), code: (if (.reason | test("^macos_os_selection_[a-z_]{1,64}$")) then .reason else "other" end)}' "$selection_audit" | tee evidence/workspace-native-code.jsonl
            else
              printf '%s\n' 'OS選択の診断元Auditがありません'
            fi
          fi
          if [ -d "$RUNNER_TEMP/macos-product-tests.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/macos-product-tests.xcresult" | tee evidence/macos-native-summary.json
            if [ '${{ inputs.target }}' = 'macos_owner' ] || [ '${{ inputs.target }}' = 'macos_adapter_lifecycle' ] || [ '${{ inputs.target }}' = 'macos_agent_registration' ] || [ '${{ inputs.target }}' = 'macos_workspace_selection' ] || [ '${{ inputs.target }}' = 'macos_agent_cli_selection' ]; then
              xcrun xcresulttool export attachments --path "$RUNNER_TEMP/macos-product-tests.xcresult" --output-path evidence/macos-ui-attachments
            fi
          fi
          if pgrep -x gui_shell_macos_broker > evidence/remaining-helper-pids.txt; then
            while read -r pid; do kill -TERM "$pid"; done < evidence/remaining-helper-pids.txt
            exit 1
          fi
          git status --short --untracked-files=all -- apps/desktop_flutter | tee evidence/desktop-working-tree.txt
          git diff --exit-code -- apps/desktop_flutter
          git diff --cached --exit-code -- apps/desktop_flutter
          test -z "$(git status --porcelain --untracked-files=all -- apps/desktop_flutter)"
      - name: 登録検証用RuntimeとWorkspaceを回収
        if: always() && (inputs.target == 'macos_agent_registration' || inputs.target == 'macos_workspace_selection' || inputs.target == 'macos_agent_cli_selection')
        shell: bash
        run: |
          set -euo pipefail
          fixture=/Users/runner/Library/Containers/com.example.guiShellDesktop/Data/d4-registration-fixture
          test ! -L "$fixture"
          if [ -d "$fixture/workspace" ]; then
            test -z "$(find "$fixture/workspace" -mindepth 1 -print -quit)"
            rmdir "$fixture/workspace"
          fi
          if [ -f "$fixture/codex" ]; then rm "$fixture/codex"; fi
          if [ -d "$fixture" ]; then rmdir "$fixture"; fi
          if [ '${{ inputs.target }}' = 'macos_agent_cli_selection' ] && [ -f /Users/runner/d4-os-selected-cli ]; then
            test ! -L /Users/runner/d4-os-selected-cli
            rm /Users/runner/d4-os-selected-cli
          fi
          if [ '${{ inputs.target }}' = 'macos_workspace_selection' ] && [ -d /Users/runner/d4-os-selected-workspace ]; then
            test ! -L /Users/runner/d4-os-selected-workspace
            test -z "$(find /Users/runner/d4-os-selected-workspace -mindepth 1 -print -quit)"
            rmdir /Users/runner/d4-os-selected-workspace
          fi
      - name: 限定証拠を保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-product-${{ github.sha }}
          path: evidence/
          retention-days: 3
          if-no-files-found: error

  apple-build:
    if: ${{ inputs.target == 'all' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: 対象commitを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 実行環境と対象を記録
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            xcodebuild -version
            xcodebuild -showsdks
          } | tee evidence/environment.txt
      - name: 固定Flutterを導入
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version | tee evidence/flutter.txt
      - name: Rust helperをMac環境で検証
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml 2>&1 | tee evidence/rust-test.txt
          cargo +1.95.0 build --locked --manifest-path native/rust_helper/Cargo.toml 2>&1 | tee evidence/rust-build.txt
          cargo +1.95.0 build --locked --manifest-path native/macos_owner/Cargo.toml --lib 2>&1 | tee evidence/rust-ui-build.txt
          file native/rust_helper/target/debug/gui_shell_rust_helper | tee evidence/rust-binary.txt
      - name: 共有UIをMac環境で検証
        working-directory: packages/gui_shell_ui
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee ../../evidence/shared-pub-get.txt
          flutter analyze --no-pub 2>&1 | tee ../../evidence/shared-analyze.txt
          flutter test --no-pub --reporter expanded 2>&1 | tee ../../evidence/shared-test.txt
      - name: macOS開発appをbuild
        working-directory: apps/desktop_flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee ../../evidence/desktop-pub-get.txt
          flutter analyze --no-pub 2>&1 | tee ../../evidence/desktop-analyze.txt
          flutter test --no-pub --reporter expanded 2>&1 | tee ../../evidence/desktop-test.txt
          flutter build macos --debug 2>&1 | tee ../../evidence/macos-build.txt
      - name: build成果物と差分を保存
        shell: bash
        run: |
          set -euo pipefail
          git status --short --untracked-files=all -- apps native > evidence/build-working-tree.txt
          git diff --binary -- apps native > evidence/build-migrations.patch
          tar -czf evidence/macos-builds.tar.gz apps/desktop_flutter/build/macos/Build/Products/Debug/*.app native/rust_helper/target/debug/gui_shell_rust_helper
          shasum -a 256 evidence/macos-builds.tar.gz > evidence/artifact-sha256.txt
          git diff --exit-code -- apps native
          git diff --cached --exit-code -- apps native
          test -z "$(git status --porcelain --untracked-files=all -- apps native)"
      - name: 補助証拠をアップロード
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apple-build-${{ github.sha }}
          path: evidence/
          retention-days: 3
          if-no-files-found: error

  ios-mobile-validation:
    if: ${{ inputs.target == 'all' || inputs.target == 'ios_mobile' || inputs.target == 'ios_product_ui' }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: 対象commitを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: 実行環境と対象を記録
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            xcodebuild -version
            xcrun simctl list devices available
          } | tee evidence/environment.txt

      - name: 固定Flutterを導入
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version | tee evidence/flutter.txt

      - name: iOS native接続用Rust Brokerと参照Runtimeを準備
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 build --locked --manifest-path native/rust_helper/Cargo.toml 2>&1 | tee evidence/ios-broker-build.txt
          git clone https://github.com/gatchimuchio/NOTNN-LLM-MINIDORA.git "$RUNNER_TEMP/minidora-reference"
          git -C "$RUNNER_TEMP/minidora-reference" checkout --detach 3400a3bb68b37efa1dc14ee8aaa28fda779bf1f8

      - name: iOS Simulatorを選択
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ inputs.target }}' = 'ios_product_ui' ]; then
            simulator_id="$(xcrun simctl create 'D4PocketNativeProduct-${{ github.run_id }}' com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          else
            simulator_id="$(xcrun simctl list devices available | sed -nE 's/.*iPhone[^()]*\(([A-Fa-f0-9-]{36})\).*/\1/p' | head -n 1)"
          fi
          test -n "$simulator_id"
          printf '%s\n' "$simulator_id" | tee evidence/ios-simulator-selected.txt

      - name: Flutter Mobile解析・試験・iOS Simulator build
        working-directory: apps/mobile_flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee ../../evidence/mobile-pub-get.txt
          flutter analyze --no-pub 2>&1 | tee ../../evidence/mobile-analyze.txt
          flutter test --no-pub --reporter expanded 2>&1 | tee ../../evidence/mobile-test.txt
          flutter build ios --simulator --debug --no-pub 2>&1 | tee ../../evidence/ios-simulator-build.txt

      - name: iOS native XCTest・実Broker接続
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(<evidence/ios-simulator-selected.txt)"
          product_args=()
          if [ '${{ inputs.target }}' = 'ios_product_ui' ]; then
            product_args+=(--ios-product-ui)
          fi
          python3 tooling/minidora_live_check.py \
            --reference "$RUNNER_TEMP/minidora-reference" \
            --ios-simulator "$simulator_id" \
            --ios-derived-data "$RUNNER_TEMP/gui-shell-ios-native-tests" \
            --ios-result-bundle "$RUNNER_TEMP/gui-shell-ios-native-tests.xcresult" \
            "${product_args[@]}" \
            2>&1 | tee evidence/ios-native-test.txt

      - name: XCTest結果要約
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result_path="$RUNNER_TEMP/gui-shell-ios-native-tests.xcresult"
          if [ -d "$result_path" ]; then
            xcrun xcresulttool get test-results summary --path "$result_path" \
              | tee evidence/ios-native-test-summary.json
          else
            printf '%s\n' 'XCTest result bundle was not created.' \
              | tee evidence/ios-native-test-summary.txt
          fi

      - name: Simulatorを終了
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s evidence/ios-simulator-selected.txt ]; then
            simulator_id="$(<evidence/ios-simulator-selected.txt)"
            xcrun simctl shutdown "$simulator_id" || true
            if [ '${{ inputs.target }}' = 'ios_product_ui' ]; then
              xcrun simctl delete "$simulator_id"
            fi
          fi

      - name: 追跡sourceの不変を確認
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short --untracked-files=all -- apps/mobile_flutter \
            | tee evidence/mobile-working-tree.txt
          git diff --exit-code -- apps/mobile_flutter
          git diff --cached --exit-code -- apps/mobile_flutter
          test -z "$(git status --porcelain --untracked-files=all -- apps/mobile_flutter)"

      - name: 限定証拠を保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-mobile-validation-${{ github.sha }}
          path: evidence/
          retention-days: 3
          if-no-files-found: error
