name: Linux manual product build and installed acceptance

'on':
  workflow_dispatch:
    inputs:
      acceptance_scope:
        description: Installed product acceptance scope
        required: true
        type: choice
        options:
          - update_lifecycle
          - credential_vault
        default: update_lifecycle

permissions:
  contents: read

concurrency:
  group: linux-export-build-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 対象commitをclean checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 隔離検証rootを作成
        shell: bash
        run: |
          set -euo pipefail
          expected_root="$RUNNER_TEMP/d4p-linux-export-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$expected_root"
          mkdir -m 700 -- "$expected_root"
          printf 'D4P_EXPORT_ROOT=%s\n' "$expected_root" >> "$GITHUB_ENV"
          printf 'D4P_FLUTTER_ROOT=%s/flutter\n' "$expected_root" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$expected_root/flutter" >> "$GITHUB_PATH"

      - name: Linux Desktop build依存を導入
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core clang cmake ninja-build pkg-config libgtk-3-dev \
            dbus-daemon gnome-keyring libglib2.0-bin libsecret-tools openbox \
            python3-pyatspi strace weston xdotool xvfb

      - name: Flutter／Rust toolchainを固定
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$head" = "$GITHUB_SHA"
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/codex/*) ;;
            *) echo 'mainまたは検証用codex branch以外を拒否した'; exit 1 ;;
          esac
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$D4P_FLUTTER_ROOT"
          flutter_commit="$(git -C "$D4P_FLUTTER_ROOT" rev-parse HEAD)"
          test "$flutter_commit" = 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          flutter precache --linux
          flutter --version --machine
          rustc --version
          cargo --version
          cmake --version | head -n 1
          ninja --version
          clang --version | head -n 1
          weston --version
          {
            printf '\n- Commit: `%s`\n' "$head"
            printf -- '- Runner: `ubuntu-24.04` (`%s/%s`)\n' "$ImageOS" "$ImageVersion"
            printf -- '- Flutter: `3.44.0` (`%s`)\n' "$flutter_commit"
            printf -- '- Rust: `%s`\n' "$(rustc --version)"
            printf -- '- Weston: `%s`\n' "$(weston --version | head -n 1)"
            printf -- '- This step covers Linux Release Export build／bundle／package／provenance only; installed-product acceptance is performed by a later step.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Broker-shaped non-authority fixtureからLinux Release buildとportable launcher初回起動
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$D4P_EXPORT_ROOT/fixture"
          output_root="$D4P_EXPORT_ROOT/output"
          umask 077
          # RFC 8032 public test vector only; this key is deliberately public and never used by a product release.
          printf '%s' '302e020100300506032b6570042204209d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60' | xxd -r -p > "$D4P_EXPORT_ROOT/test-update-private.der"
          openssl pkey -inform DER -in "$D4P_EXPORT_ROOT/test-update-private.der" -pubout -outform DER -out "$D4P_EXPORT_ROOT/test-update-public.der"
          python3 tooling/tests/create_linux_update_catalog_fixture.py --private-key "$D4P_EXPORT_ROOT/test-update-private.der"
          git diff --exit-code -- tooling/tests/fixtures/linux-update-catalog/updates.json tooling/tests/fixtures/linux-update-catalog/linux-installed-catalog-display.pkg
          catalog_base_url="https://raw.githubusercontent.com/gatchimuchio/D4-POCKET/${GITHUB_SHA}/tooling/tests/fixtures/linux-update-catalog"
          python3 tooling/tests/create_linux_export_fixture.py \
            --output-dir "$fixture_root" \
            --update-trust-public-key-der "$D4P_EXPORT_ROOT/test-update-public.der" \
            --update-trust-base-url "$catalog_base_url"
          python3 tooling/export_linux_product.py \
            --receipt "$fixture_root/d4_pocket_export_receipt.json" \
            --manifest-file "$fixture_root/d4-pocket-app-11111111111111111111111111111111.json" \
            --output-dir "$output_root" \
            --allow-verification-branch
          python3 tooling/package_linux_product.py \
            --source-dir "$output_root/bundle" \
            --output "$output_root/D4Pocket-linux-rollback.d4pkg" \
            --product-version 0.1.1
          python3 -c 'import hashlib,json,pathlib,sys; root=pathlib.Path(sys.argv[1]); evidence=json.loads((root/"d4_pocket_linux_export_build.json").read_text()); package=root/"D4Pocket-linux.d4pkg"; assert evidence["target_platform"]=="linux"; assert evidence["source_commit"]==sys.argv[2]; assert evidence["signed"] is False and evidence["formal_distribution_claimed"] is False; assert evidence["package"]["installed_product_verified"] is False; assert evidence["package"]["sha256"]==hashlib.sha256(package.read_bytes()).hexdigest(); print(json.dumps({"source_commit":evidence["source_commit"],"artifact_tree_sha256":evidence["artifact_tree_sha256"],"package_sha256":evidence["package"]["sha256"],"signed":False,"installed_product_verified":False},separators=(",",":")))' "$output_root" "$(git rev-parse HEAD)" | tee "$D4P_EXPORT_ROOT/build-result.json"
          python3 -m unittest tooling.tests.test_linux_gtk_bundle_smoke
          dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_gtk_bundle_smoke.py \
            --launcher "$output_root/bundle/gui_shell_desktop_launcher" \
            --temp-root "$D4P_EXPORT_ROOT" \
            --backend x11
          dbus-run-session -- python3 tooling/tests/linux_gtk_bundle_smoke.py \
            --launcher "$output_root/bundle/gui_shell_desktop_launcher" \
            --temp-root "$D4P_EXPORT_ROOT" \
            --backend wayland
          {
            printf '\n- Export evidence: `%s`\n' "$(cat "$output_root/d4_pocket_linux_export_build.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["artifact_tree_sha256"])')"
            printf -- '- Package hash: `%s`\n' "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["package"]["sha256"])' "$output_root/d4_pocket_linux_export_build.json")"
            printf -- '- Fixture: synthetic Broker-shaped Receipt／Manifest; no Owner authority or credentials.\n'
            printf -- '- Runtime smoke: portable product Rust launcher opened and normally closed its Flutter GTK window under Xvfb/X11; Wayland run used Weston headless/Pixman, verified the live launcher GTK process successfully connected to the isolated Wayland socket using external connect-syscall observation, then stopped the owned process group. No debug environment variable was required or forwarded through the frontend allowlist. Both used an initially absent XDG_DATA_HOME and verified cleanup.\n'
            printf -- '- Scope: portable first-launch, Linux GTK X11 window close, and Wayland socket-connect smoke only; the Wayland check does not prove surface rendering. not signed Install/Owner activation, installed-version handoff, production compositor coverage, formal distribution, or runtime Manifest consumption.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: installed GTK UIでRollback／Export／Uninstallを受入れる
        if: ${{ inputs.acceptance_scope == 'update_lifecycle' }}
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
          D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE: ${{ runner.temp }}/d4p-linux-export-${{ github.run_id }}-${{ github.run_attempt }}/output/D4Pocket-linux-rollback.d4pkg
        run: |
          set -euo pipefail
          test_package="$D4P_EXPORT_ROOT/output/D4Pocket-linux.d4pkg"
          acceptance_root="$D4P_EXPORT_ROOT/installed-acceptance"
          dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_installed_product_smoke.py \
            --package "$test_package" \
            --temp-root "$D4P_EXPORT_ROOT" \
            --acceptance-root "$acceptance_root" \
            --private-key "$D4P_EXPORT_ROOT/test-update-private.der" \
            --update-package "$D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE"
          {
            printf '\n- Installed acceptance: the Release package passed Broker stage／activation with an RFC 8032 public test-vector Ed25519 candidate signature bound to its exact package hash, fixed XDG desktop entry validation, `gio launch` under X11, normal GTK window close, owned-process cleanup, and durable LIVE_RUNTIME startup／exit Audit reload. A second installed-entry launch ran with X11／XAUTHORITY removed under isolated Weston/Wayland; the GTK top-level was AT-SPI `SHOWING` and owned processes were stopped. This does not establish Wayland surface rendering, compositor coverage beyond Weston headless/Pixman, or production signing.\n'
            printf -- '- Test update trust: RFC 8032 published Ed25519 test vector. Only its public trust enters the synthetic export Manifest／product; the known test-only private vector is isolated under this run temporary root, passed only to the Rust acceptance seeder, never included in the installed app, and removed by exact-root cleanup. It is not a secret or production signing identity.\n'
            printf -- '- Rollback UI LIVE_RUNTIME: a second package from the exact same Release bundle was seeded as `0.1.1` over the installed `0.1.0`. The installed Update Center then downloaded／staged／activated the separate signed test candidate `0.1.2`; fresh native Owner rejection followed by a new approval for rollback switched `0.1.2` → `0.1.1`, preserving exact desktop-entry bytes and the already-running product process. Durable Broker Audit retains the operation decisions and evidence classes.\n'
            printf -- '- Export Owner boundary: the installed product UI activates the exact visible Export command via its exposed AT-SPI Tap action and sends Enter only after visible focus; native Owner Reject／Allow uses its verified GTK control. Reject creates no file; a new request plus Allow reaches the installed Rust Broker and creates a fresh Linux App／Audit identity Manifest. The file-backed Audit chain／anchor HMAC is LIVE_RUNTIME-reloaded; individual Export events retain their `INTERNAL_STATE` evidence classification.\n'
            printf -- '- Uninstaller LIVE_RUNTIME: after X11／Wayland launch checks, the installed UI opens Update Center and requests Uninstall. Native Owner rejection leaves the fixed product root, active-version record, desktop entry, and running process group intact. A separate Owner approval requests required application exit; the launcher consumes the one-time handoff, removes only the fixed product root／entry, and leaves a config sentinel plus the file-backed Audit Store and anchor outside that root. Both decisions and completion are checked in the chained Audit.\n'
            printf -- '- Update Center LIVE_RUNTIME: installed UI fetched the immutable-commit catalog and package from raw.githubusercontent.com over Broker-owned HTTPS; current Broker trust verified the Ed25519 candidate and exact package digest／length. Automated UI accepted separate download, stage, and activation native Owner dialogs, while each preceding rejection left package／stage／active record／desktop entry／running process unchanged. The resulting 0.1.2 test candidate was then Owner-rolled back to the runnable 0.1.1 release bundle. Audit contains the remote download LIVE_RUNTIME completion and durable stage／activation／rollback decisions.\n'
            printf -- '- The remote update package is a deliberately non-executable 1.8 KiB test-only Linux D4PKG fixture signed with the published RFC 8032 test key; it was never launched and is not a release payload. All UI actions use automated AT-SPI／keyboard input, not a human gesture. Scope: Ubuntu hosted Xvfb／X11 plus isolated Weston headless/Pixman Wayland session and test identity; Wayland surface rendering is not established. Not real desktop-session distribution coverage, production signing／publisher identity, Secret Service／MCP, Workspace selection, Agent Task recovery, production update artifact acceptance, or release readiness.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: installed GTK UIでSecret Service Credential Vaultを受入れる
        if: ${{ inputs.acceptance_scope == 'credential_vault' }}
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
          D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE: ${{ runner.temp }}/d4p-linux-export-${{ github.run_id }}-${{ github.run_attempt }}/output/D4Pocket-linux-rollback.d4pkg
        run: |
          set -euo pipefail
          test_package="$D4P_EXPORT_ROOT/output/D4Pocket-linux.d4pkg"
          acceptance_root="$D4P_EXPORT_ROOT/installed-credential-acceptance"
          dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_installed_product_smoke.py \
            --package "$test_package" \
            --temp-root "$D4P_EXPORT_ROOT" \
            --acceptance-root "$acceptance_root" \
            --private-key "$D4P_EXPORT_ROOT/test-update-private.der" \
            --update-package "$D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE" \
            --acceptance-scope credential_vault
          {
            printf '\n- Installed Credential acceptance: isolated unlocked run-owned GNOME Secret Service; installed GTK native masked-entry path; Owner reject produced no stored items; a distinct Owner allow created one metadata record and separate key／ciphertext items; normal installed-app exit／restart reloaded the same active metadata from durable Broker Audit; Owner reject／allow for logical revocation preserved the two Secret Service items; final metadata was revoked; Audit chain／anchor HMAC and test-secret non-exposure in UI／Audit／logs／acceptance files were checked.\n'
            printf -- '- Scope: Ubuntu 24.04 hosted Xvfb／X11, unsigned test-identity installed product and automated AT-SPI／keyboard input. This does not establish MCP child injection／Tool execution, Secret Service behavior in other Linux desktop sessions, Wayland rendering, production package signing／distribution, or full Linux product completion.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: build fixture／bundleを正確な一時rootから削除
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected_root="$RUNNER_TEMP/d4p-linux-export-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -z "${D4P_EXPORT_ROOT:-}" ] || [ "$D4P_EXPORT_ROOT" != "$expected_root" ]; then
            echo '一時rootがこのrunの正確な所有pathではない'
            exit 1
          fi
          if [ -L "$D4P_EXPORT_ROOT" ]; then
            echo '一時rootがsymlink'
            exit 1
          fi
          if [ -e "$D4P_EXPORT_ROOT" ]; then
            rm -rf -- "$D4P_EXPORT_ROOT"
          fi
          test ! -e "$D4P_EXPORT_ROOT"
