name: Linux manual product build and installed acceptance

'on':
  workflow_dispatch:
    inputs:
      acceptance_scope:
        description: Linux product build and acceptance scope
        required: true
        type: choice
        options:
          - product_build
          - update_lifecycle
          - credential_vault
          - mcp_tool_execution
          - mcp_credential_binding
          - a2a_metadata
          - host_registration
          - workspace_selection
          - agent_task_supervision
          - agent_task_crash_recovery
          - provider_credential_binding
          - runtime_provenance
          - wayland_rendering
          - wayland_workspace_selection
          - portable_archive
          - debian_setup_package
          - debian_setup_first_install
          - debian_setup_lifecycle
        default: update_lifecycle

permissions:
  contents: read

concurrency:
  group: linux-export-build-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-build:
    runs-on: ${{ (inputs.acceptance_scope == 'agent_task_supervision' || inputs.acceptance_scope == 'agent_task_crash_recovery' || inputs.acceptance_scope == 'provider_credential_binding') && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: 対象commitをclean checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 隔離検証rootを作成
        shell: bash
        run: |
          set -euo pipefail
          expected_root="$RUNNER_TEMP/d4p-linux-export-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$expected_root"
          mkdir -m 700 -- "$expected_root"
          printf 'D4P_EXPORT_ROOT=%s\n' "$expected_root" >> "$GITHUB_ENV"
          printf 'D4P_FLUTTER_ROOT=%s/flutter\n' "$expected_root" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$expected_root/flutter" >> "$GITHUB_PATH"

      - name: Linux Desktop build依存を導入
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(
            at-spi2-core clang cmake ninja-build pkg-config libgtk-3-dev \
            xdg-desktop-portal xdg-desktop-portal-gtk \
            bubblewrap dbus-daemon gnome-keyring libglib2.0-bin openbox \
            python3-dbus python3-pyatspi strace weston xdotool xvfb
          )
          if [ '${{ inputs.acceptance_scope }}' = 'wayland_workspace_selection' ]; then
            packages+=(sway wtype)
          fi
          if [ '${{ inputs.acceptance_scope }}' = 'debian_setup_package' ] || \
             [ '${{ inputs.acceptance_scope }}' = 'debian_setup_first_install' ] || \
             [ '${{ inputs.acceptance_scope }}' = 'debian_setup_lifecycle' ]; then
            packages+=(dpkg-dev)
          fi
          sudo apt-get install --yes --no-install-recommends "${packages[@]}"

      - name: Codex Linux sandbox capability gate
        id: codex_sandbox
        if: ${{ inputs.acceptance_scope == 'agent_task_supervision' || inputs.acceptance_scope == 'agent_task_crash_recovery' || inputs.acceptance_scope == 'provider_credential_binding' }}
        shell: bash
        run: |
          set -euo pipefail
          probe_log="$D4P_EXPORT_ROOT/codex-bwrap-preflight.txt"
          test ! -e "$probe_log"
          if bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent \
            --ro-bind / / --dev /dev --proc /proc -- /bin/true >"$probe_log" 2>&1; then
            printf 'available=true\n' >> "$GITHUB_OUTPUT"
            printf '\n- Agent Task LIVE_RUNTIME preflight: PASS; rootless bubblewrap user／PID／network namespaces are available.\n' >> "$GITHUB_STEP_SUMMARY"
          elif grep -Fq 'bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted' "$probe_log"; then
            printf 'available=false\n' >> "$GITHUB_OUTPUT"
            printf '\n- Agent Task LIVE_RUNTIME: NOT_RUN; this GitHub-hosted runner denies bubblewrap network-namespace loopback setup (`RTM_NEWADDR`). The product sandbox is unchanged; this host limitation is not reported as an installed-product failure.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$probe_log"
            exit 1
          fi

      - name: Flutter／Rust toolchainを固定
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$head" = "$GITHUB_SHA"
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/codex/*) ;;
            *) echo 'mainまたは検証用codex branch以外を拒否した'; exit 1 ;;
          esac
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$D4P_FLUTTER_ROOT"
          flutter_commit="$(git -C "$D4P_FLUTTER_ROOT" rev-parse HEAD)"
          test "$flutter_commit" = 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          flutter precache --linux
          flutter --version --machine
          rustc --version
          cargo --version
          cmake --version | head -n 1
          ninja --version
          clang --version | head -n 1
          weston --version
          runner_label="ubuntu-24.04"
          if [ '${{ inputs.acceptance_scope }}' = 'agent_task_supervision' ] || [ '${{ inputs.acceptance_scope }}' = 'agent_task_crash_recovery' ] || [ '${{ inputs.acceptance_scope }}' = 'provider_credential_binding' ]; then
            runner_label="ubuntu-22.04"
          fi
          {
            printf '\n- Commit: `%s`\n' "$head"
            printf -- '- Runner: `%s` (`%s/%s`)\n' "$runner_label" "$ImageOS" "$ImageVersion"
            printf -- '- Flutter: `3.44.0` (`%s`)\n' "$flutter_commit"
            printf -- '- Rust: `%s`\n' "$(rustc --version)"
            printf -- '- Weston: `%s`\n' "$(weston --version | head -n 1)"
            if [ '${{ inputs.acceptance_scope }}' = 'wayland_workspace_selection' ]; then
              sway_version="$(sway --version | head -n 1)"
              wtype_version="$(dpkg-query -W -f='${Version}' wtype)"
              printf -- '- Wayland input test: `%s`; `wtype %s`\n' "$sway_version" "$wtype_version"
            fi
            printf -- '- This step covers Linux Release Export build／bundle／package／provenance only; installed-product acceptance is performed by a later step.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Linux test-only environment allowlist gateをRust試験
        if: ${{ inputs.acceptance_scope == 'agent_task_supervision' || inputs.acceptance_scope == 'agent_task_crash_recovery' || inputs.acceptance_scope == 'provider_credential_binding' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path native/rust_helper/Cargo.toml \
            --lib --features linux-desktop-broker \
            frontend_environment_drops_credentials_and_loader_overrides
          cargo test --locked --manifest-path native/rust_helper/Cargo.toml \
            --lib --features linux-desktop-broker,r2-e2e \
            frontend_environment_drops_credentials_and_loader_overrides
          cargo test --locked --manifest-path native/rust_helper/Cargo.toml \
            --lib --features linux-desktop-broker \
            agent_cli_owner_summary_does_not_claim_another_platforms_boundary
          cargo test --locked --manifest-path native/rust_helper/Cargo.toml \
            --lib --features linux-desktop-broker,r2-e2e \
            agent_cli_owner_summary_does_not_claim_another_platforms_boundary
          printf '\n- Frontend environment allowlist: test-only settings are rejected by the normal Linux feature set and admitted only by the dedicated `r2-e2e` verification feature. Agent CLI Owner confirmation text is tested with both normal and verification feature sets.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Broker-shaped non-authority fixtureからLinux Release buildとscope別launcher起動
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$D4P_EXPORT_ROOT/fixture"
          output_root="$D4P_EXPORT_ROOT/output"
          umask 077
          # RFC 8032 public test vector only; this key is deliberately public and never used by a product release.
          printf '%s' '302e020100300506032b6570042204209d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60' | xxd -r -p > "$D4P_EXPORT_ROOT/test-update-private.der"
          openssl pkey -inform DER -in "$D4P_EXPORT_ROOT/test-update-private.der" -pubout -outform DER -out "$D4P_EXPORT_ROOT/test-update-public.der"
          python3 tooling/tests/create_linux_update_catalog_fixture.py --private-key "$D4P_EXPORT_ROOT/test-update-private.der"
          git diff --exit-code -- tooling/tests/fixtures/linux-update-catalog/updates.json tooling/tests/fixtures/linux-update-catalog/linux-installed-catalog-display.pkg
          catalog_base_url="https://raw.githubusercontent.com/gatchimuchio/D4-POCKET/${GITHUB_SHA}/tooling/tests/fixtures/linux-update-catalog"
          fixture_arguments=(
            --output-dir "$fixture_root"
            --update-trust-public-key-der "$D4P_EXPORT_ROOT/test-update-public.der"
            --update-trust-base-url "$catalog_base_url"
          )
          if [ '${{ inputs.acceptance_scope }}' = 'host_registration' ]; then
            fixture_arguments+=(--include-host-operations)
          fi
          python3 tooling/tests/create_linux_export_fixture.py "${fixture_arguments[@]}"
          export_arguments=(
            --receipt "$fixture_root/d4_pocket_export_receipt.json"
            --manifest-file "$fixture_root/d4-pocket-app-11111111111111111111111111111111.json"
            --output-dir "$output_root"
            --allow-verification-branch
          )
          if [ '${{ inputs.acceptance_scope }}' = 'agent_task_supervision' ] || [ '${{ inputs.acceptance_scope }}' = 'agent_task_crash_recovery' ] || [ '${{ inputs.acceptance_scope }}' = 'provider_credential_binding' ]; then
            export_arguments+=(--r2-e2e-test-build)
          fi
          python3 tooling/export_linux_product.py "${export_arguments[@]}"
          python3 tooling/package_linux_product.py \
            --source-dir "$output_root/bundle" \
            --output "$output_root/D4Pocket-linux-rollback.d4pkg" \
            --product-version 0.1.1
          python3 - "$output_root" "$(git rev-parse HEAD)" '${{ inputs.acceptance_scope }}' <<'PY' | tee "$D4P_EXPORT_ROOT/build-result.json"
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          evidence = json.loads((root / "d4_pocket_linux_export_build.json").read_text())
          package = root / "D4Pocket-linux.d4pkg"
          expected_test_build = sys.argv[3] in {"agent_task_supervision", "agent_task_crash_recovery", "provider_credential_binding"}
          assert evidence["target_platform"] == "linux"
          assert evidence["source_commit"] == sys.argv[2]
          assert evidence["signed"] is False and evidence["formal_distribution_claimed"] is False
          assert evidence["package"]["installed_product_verified"] is False
          assert evidence["package"]["sha256"] == hashlib.sha256(package.read_bytes()).hexdigest()
          if sys.argv[3] == "portable_archive":
              archive = evidence["portable_archive"]
              assert archive["target"] == "ubuntu-24.04-x86_64"
              assert archive["signed"] is False
              archive_path = root / archive["file_name"]
              assert archive["byte_length"] == archive_path.stat().st_size
              assert archive["sha256"] == hashlib.sha256(archive_path.read_bytes()).hexdigest()
          assert evidence["cmake_configure_arguments"].count(
              "-DD4_LINUX_R2_E2E_TEST_BUILD=ON" if expected_test_build
              else "-DD4_LINUX_R2_E2E_TEST_BUILD=OFF"
          ) == 1
          assert evidence["cmake_configure_arguments"].count(
              "-DD4_LINUX_R2_E2E_TEST_BUILD=ON" if not expected_test_build
              else "-DD4_LINUX_R2_E2E_TEST_BUILD=OFF"
          ) == 0
          print(json.dumps({"source_commit": evidence["source_commit"], "artifact_tree_sha256": evidence["artifact_tree_sha256"], "package_sha256": evidence["package"]["sha256"], "r2_e2e_test_build": expected_test_build, "signed": False, "installed_product_verified": False}, separators=(",", ":")))
          PY
          python3 -m unittest tooling.tests.test_linux_gtk_bundle_smoke
          python3 -m unittest tooling.tests.test_linux_installed_product_smoke
          python3 -m unittest tooling.tests.test_export_linux_product
          python3 -m unittest tooling.tests.test_linux_portable_archive
          if [ '${{ inputs.acceptance_scope }}' = 'debian_setup_package' ] || \
             [ '${{ inputs.acceptance_scope }}' = 'debian_setup_first_install' ] || \
             [ '${{ inputs.acceptance_scope }}' = 'debian_setup_lifecycle' ]; then
            python3 -m unittest tooling.tests.test_linux_deb_setup_package
          fi
          if [ '${{ inputs.acceptance_scope }}' = 'portable_archive' ]; then
            archive_name="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["portable_archive"]["file_name"])' "$output_root/d4_pocket_linux_export_build.json")"
            python3 - "$output_root" "$archive_name" <<'PY'
          import hashlib, json, pathlib, stat, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          evidence = json.loads((root / "d4_pocket_linux_export_build.json").read_text())
          record = evidence["portable_archive"]
          archive = root / sys.argv[2]
          assert record["target"] == "ubuntu-24.04-x86_64" and record["format"] == "tar.gz"
          assert record["file_name"] == archive.name and archive.parent.resolve() == root
          assert stat.S_ISREG(archive.lstat().st_mode)
          assert archive.stat().st_size == record["byte_length"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == record["sha256"]
          PY
            extracted_root="$D4P_EXPORT_ROOT/portable-extracted"
            mkdir -m 700 "$extracted_root"
            umask 077
            tar --no-same-owner --no-same-permissions -xzf "$output_root/$archive_name" -C "$extracted_root"
            test -f "$extracted_root/D4Pocket/gui_shell_desktop_launcher"
            test -x "$extracted_root/D4Pocket/gui_shell_desktop_launcher"
            dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_gtk_bundle_smoke.py \
              --launcher "$extracted_root/D4Pocket/gui_shell_desktop_launcher" \
              --temp-root "$D4P_EXPORT_ROOT" \
              --backend x11
            dbus-run-session -- python3 tooling/tests/linux_gtk_bundle_smoke.py \
              --launcher "$extracted_root/D4Pocket/gui_shell_desktop_launcher" \
              --temp-root "$D4P_EXPORT_ROOT" \
              --backend wayland
          elif [ '${{ inputs.acceptance_scope }}' != 'product_build' ] && \
             [ '${{ inputs.acceptance_scope }}' != 'runtime_provenance' ] && \
             [ '${{ inputs.acceptance_scope }}' != 'wayland_rendering' ] && \
             [ '${{ inputs.acceptance_scope }}' != 'debian_setup_package' ] && \
             [ '${{ inputs.acceptance_scope }}' != 'debian_setup_first_install' ] && \
             [ '${{ inputs.acceptance_scope }}' != 'debian_setup_lifecycle' ]; then
            dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_gtk_bundle_smoke.py \
              --launcher "$output_root/bundle/gui_shell_desktop_launcher" \
              --temp-root "$D4P_EXPORT_ROOT" \
              --backend x11
            dbus-run-session -- python3 tooling/tests/linux_gtk_bundle_smoke.py \
              --launcher "$output_root/bundle/gui_shell_desktop_launcher" \
              --temp-root "$D4P_EXPORT_ROOT" \
              --backend wayland
          fi
          {
            printf '\n- Export evidence: `%s`\n' "$(cat "$output_root/d4_pocket_linux_export_build.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["artifact_tree_sha256"])')"
            printf -- '- Package hash: `%s`\n' "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["package"]["sha256"])' "$output_root/d4_pocket_linux_export_build.json")"
            if [ '${{ inputs.acceptance_scope }}' = 'portable_archive' ]; then
              printf -- '- Portable archive hash: `%s`\n' "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["portable_archive"]["sha256"])' "$output_root/d4_pocket_linux_export_build.json")"
            fi
            printf -- '- Fixture: synthetic Broker-shaped Receipt／Manifest; no Owner authority or credentials.\n'
            if [ '${{ inputs.acceptance_scope }}' = 'runtime_provenance' ]; then
              printf -- '- Portable X11／Wayland smoke was skipped because this scope verifies the installed product provenance; previously accepted scopes are not replayed.\n'
            elif [ '${{ inputs.acceptance_scope }}' = 'product_build' ]; then
              printf -- '- Build-only scope: Linux Release export／package compilation and export helper unit tests ran. Portable launcher smoke and every installed-product Acceptance scope were skipped. This does not establish runtime or product acceptance.\n'
            elif [ '${{ inputs.acceptance_scope }}' = 'wayland_rendering' ]; then
              printf -- '- Portable smoke was skipped; the dedicated installed-product Wayland surface-rendering acceptance runs below.\n'
            elif [ '${{ inputs.acceptance_scope }}' = 'portable_archive' ]; then
              printf -- '- The unsigned Ubuntu 24.04 x86_64 tar.gz was hash-checked and extracted in the isolated runner; its extracted launcher completed the portable X11／Wayland smoke. This is not a signed distribution or general Linux acceptance.\n'
            elif [ '${{ inputs.acceptance_scope }}' = 'debian_setup_package' ]; then
              printf -- '- Debian Setup package acceptance follows in a separate installed-package step; the APT package is a first-run bootstrap and does not replace Broker-controlled per-user product install/update/rollback/uninstall.\n'
            elif [ '${{ inputs.acceptance_scope }}' = 'debian_setup_first_install' ]; then
              printf -- '- APT-installed Setup UIからの初回Broker導入Acceptanceを専用stepで実行します。従来のbootstrap package更新／rollback Acceptanceは再実行しません。\n'
            elif [ '${{ inputs.acceptance_scope }}' = 'debian_setup_lifecycle' ]; then
              printf -- '- APT-installed Setup初回導入からinstalled Update Centerのdownload／stage／activation／rollback、Export、Uninstallまでを同じrunで接続するD4-LNX-T06統合acceptanceを専用stepで実行します。更新candidateは既存の非実行test fixtureです。\n'
            else
              printf -- '- Runtime smoke: portable product Rust launcher opened and normally closed its Flutter GTK window under Xvfb/X11; Wayland run used Weston headless/Pixman, verified the live launcher GTK process successfully connected to the isolated Wayland socket using external connect-syscall observation, then stopped the owned process group. No debug environment variable was required or forwarded through the frontend allowlist. Both used an initially absent XDG_DATA_HOME and verified cleanup.\n'
              printf -- '- Scope: portable first-launch, Linux GTK X11 window close, and Wayland socket-connect smoke only; the Wayland check does not prove surface rendering. This build is not signed Install/Owner activation, installed-version handoff, production compositor coverage, formal distribution, or runtime Manifest consumption.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ubuntu 24.04 APT setup package install／update／rollback／uninstall
        if: ${{ inputs.acceptance_scope == 'debian_setup_package' }}
        shell: bash
        run: |
          set -euo pipefail
          output_root="$D4P_EXPORT_ROOT/output"
          acceptance_root="$D4P_EXPORT_ROOT/debian-setup-acceptance"
          mkdir -m 700 -- "$acceptance_root"
          test "$(dpkg --print-architecture)" = amd64
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          package_status="$(dpkg-query -W -f='${Status}' d4-pocket-setup 2>/dev/null || true)"
          if [ -n "$package_status" ]; then
            echo 'runnerにD4 Pocket Setup packageが事前存在する'
            exit 1
          fi

          package_dir="$output_root/debian-setup"
          evidence="$output_root/d4_pocket_linux_export_build.json"
          python3 tooling/package_linux_deb_setup.py \
            --source-dir "$output_root/bundle" \
            --build-evidence "$evidence" \
            --output-dir "$package_dir" \
            --package-revision 1 > "$acceptance_root/package-v1.json"
          python3 tooling/package_linux_deb_setup.py \
            --source-dir "$output_root/bundle" \
            --build-evidence "$evidence" \
            --output-dir "$package_dir" \
            --package-revision 2 > "$acceptance_root/package-v2.json"

          read -r deb_v1 deb_v2 source_commit artifact_tree_sha app_id audit_store_id < <(
            python3 - "$acceptance_root/package-v1.json" "$acceptance_root/package-v2.json" "$GITHUB_SHA" "$output_root/bundle/product_manifest.json" <<'PY'
          import hashlib, json, pathlib, sys
          one_path, two_path = map(pathlib.Path, sys.argv[1:3])
          one, two = json.loads(one_path.read_text()), json.loads(two_path.read_text())
          expected_commit = sys.argv[3]
          manifest = json.loads(pathlib.Path(sys.argv[4]).read_text())["manifest"]
          assert one["evidence_type"] == two["evidence_type"] == "d4_pocket_linux_debian_setup_package"
          assert one["target"] == two["target"] == "ubuntu-24.04-amd64"
          assert one["package_version"].rsplit("-", 1)[0] == two["package_version"].rsplit("-", 1)[0]
          assert one["package_version"].endswith("-1") and two["package_version"].endswith("-2")
          assert one["source_commit"] == two["source_commit"] == expected_commit
          assert one["artifact_tree_sha256"] == two["artifact_tree_sha256"]
          assert one["scope"] == "first_run_setup_bootstrap_only"
          assert one["signed"] is False and one["owner_authorization_created"] is False
          assert one["permission_created"] is False and one["approval_created"] is False
          assert one["credential_values_included"] is False and one["user_xdg_data_modified_by_package"] is False
          assert one["package_manager_scripts"] == [] and two["package_manager_scripts"] == []
          for record in (one, two):
              package = pathlib.Path(record["output_path"])
              assert package.is_file() and package.stat().st_size == record["package_size_bytes"]
              assert hashlib.sha256(package.read_bytes()).hexdigest() == record["package_sha256"]
          print(one["output_path"], two["output_path"], one["source_commit"], one["artifact_tree_sha256"], manifest["app_identity"]["app_id"], manifest["audit_store"]["store_id"])
          PY
          )
          test "$(dpkg-deb --field "$deb_v1" Package)" = d4-pocket-setup
          test "$(dpkg-deb --field "$deb_v2" Architecture)" = amd64
          dpkg --compare-versions "$(dpkg-deb --field "$deb_v1" Version)" lt "$(dpkg-deb --field "$deb_v2" Version)"
          touch "$acceptance_root/package-install-started"

          xdg_data="$acceptance_root/isolated-xdg-data"
          sentinel="$xdg_data/apps/d4-pocket/$app_id/stores/$audit_store_id/owner-data-sentinel"
          mkdir -m 700 -p -- "$(dirname "$sentinel")"
          printf 'keep-user-owned-data\n' > "$sentinel"
          sentinel_hash="$(sha256sum "$sentinel" | cut -d ' ' -f 1)"

          sudo apt-get install --yes --no-install-recommends "$deb_v1"
          test "$(dpkg-query -W -f='${Version}' d4-pocket-setup)" = "$(dpkg-deb --field "$deb_v1" Version)"
          test -x /opt/d4-pocket/setup/gui_shell_desktop_launcher
          test -f /usr/share/applications/d4-pocket-setup.desktop
          test "$(stat -c '%U:%G:%a' /opt/d4-pocket/setup/gui_shell_desktop_launcher)" = root:root:755
          grep -Fx 'Exec=/opt/d4-pocket/setup/gui_shell_desktop_launcher' /usr/share/applications/d4-pocket-setup.desktop

          sudo apt-get install --yes --no-install-recommends "$deb_v2"
          test "$(dpkg-query -W -f='${Version}' d4-pocket-setup)" = "$(dpkg-deb --field "$deb_v2" Version)"
          dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_gtk_bundle_smoke.py \
            --launcher /opt/d4-pocket/setup/gui_shell_desktop_launcher \
            --temp-root "$acceptance_root" \
            --backend x11

          printf 'not a Debian package\n' > "$acceptance_root/invalid-update.deb"
          if sudo apt-get install --yes "$acceptance_root/invalid-update.deb"; then
            echo 'invalid update unexpectedly succeeded'
            exit 1
          fi
          test "$(dpkg-query -W -f='${Version}' d4-pocket-setup)" = "$(dpkg-deb --field "$deb_v2" Version)"
          sudo apt-get install --reinstall --yes --no-install-recommends "$deb_v2"
          test "$(dpkg-query -W -f='${Version}' d4-pocket-setup)" = "$(dpkg-deb --field "$deb_v2" Version)"

          sudo apt-get install --allow-downgrades --yes --no-install-recommends "$deb_v1"
          test "$(dpkg-query -W -f='${Version}' d4-pocket-setup)" = "$(dpkg-deb --field "$deb_v1" Version)"
          sudo apt-get install --yes --no-install-recommends "$deb_v2"
          test "$(dpkg-query -W -f='${Version}' d4-pocket-setup)" = "$(dpkg-deb --field "$deb_v2" Version)"

          sudo apt-get purge --yes d4-pocket-setup
          test ! -e /opt/d4-pocket/setup
          test ! -e /usr/share/applications/d4-pocket-setup.desktop
          test -f "$sentinel"
