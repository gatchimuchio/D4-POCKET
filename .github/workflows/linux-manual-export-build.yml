name: Linux manual product build and installed acceptance

'on':
  workflow_dispatch:
    inputs:
      acceptance_scope:
        description: Installed product acceptance scope
        required: true
        type: choice
        options:
          - update_lifecycle
          - credential_vault
          - mcp_tool_execution
          - workspace_selection
          - agent_task_supervision
          - runtime_provenance
        default: update_lifecycle

permissions:
  contents: read

concurrency:
  group: linux-export-build-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-build:
    runs-on: ${{ inputs.acceptance_scope == 'agent_task_supervision' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: 対象commitをclean checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 隔離検証rootを作成
        shell: bash
        run: |
          set -euo pipefail
          expected_root="$RUNNER_TEMP/d4p-linux-export-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$expected_root"
          mkdir -m 700 -- "$expected_root"
          printf 'D4P_EXPORT_ROOT=%s\n' "$expected_root" >> "$GITHUB_ENV"
          printf 'D4P_FLUTTER_ROOT=%s/flutter\n' "$expected_root" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$expected_root/flutter" >> "$GITHUB_PATH"

      - name: Linux Desktop build依存を導入
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core clang cmake ninja-build pkg-config libgtk-3-dev \
            bubblewrap dbus-daemon gnome-keyring libglib2.0-bin openbox \
            python3-dbus python3-pyatspi strace weston xdotool xvfb

      - name: Codex Linux sandbox capability gate
        id: codex_sandbox
        if: ${{ inputs.acceptance_scope == 'agent_task_supervision' }}
        shell: bash
        run: |
          set -euo pipefail
          probe_log="$D4P_EXPORT_ROOT/codex-bwrap-preflight.txt"
          test ! -e "$probe_log"
          if bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent \
            --ro-bind / / --dev /dev --proc /proc -- /bin/true >"$probe_log" 2>&1; then
            printf 'available=true\n' >> "$GITHUB_OUTPUT"
            printf '\n- Agent Task LIVE_RUNTIME preflight: PASS; rootless bubblewrap user／PID／network namespaces are available.\n' >> "$GITHUB_STEP_SUMMARY"
          elif grep -Fq 'bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted' "$probe_log"; then
            printf 'available=false\n' >> "$GITHUB_OUTPUT"
            printf '\n- Agent Task LIVE_RUNTIME: NOT_RUN; this GitHub-hosted runner denies bubblewrap network-namespace loopback setup (`RTM_NEWADDR`). The product sandbox is unchanged; this host limitation is not reported as an installed-product failure.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$probe_log"
            exit 1
          fi

      - name: Flutter／Rust toolchainを固定
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$head" = "$GITHUB_SHA"
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/codex/*) ;;
            *) echo 'mainまたは検証用codex branch以外を拒否した'; exit 1 ;;
          esac
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$D4P_FLUTTER_ROOT"
          flutter_commit="$(git -C "$D4P_FLUTTER_ROOT" rev-parse HEAD)"
          test "$flutter_commit" = 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          flutter precache --linux
          flutter --version --machine
          rustc --version
          cargo --version
          cmake --version | head -n 1
          ninja --version
          clang --version | head -n 1
          weston --version
          runner_label="ubuntu-24.04"
          if [ '${{ inputs.acceptance_scope }}' = 'agent_task_supervision' ]; then
            runner_label="ubuntu-22.04"
          fi
          {
            printf '\n- Commit: `%s`\n' "$head"
            printf -- '- Runner: `%s` (`%s/%s`)\n' "$runner_label" "$ImageOS" "$ImageVersion"
            printf -- '- Flutter: `3.44.0` (`%s`)\n' "$flutter_commit"
            printf -- '- Rust: `%s`\n' "$(rustc --version)"
            printf -- '- Weston: `%s`\n' "$(weston --version | head -n 1)"
            printf -- '- This step covers Linux Release Export build／bundle／package／provenance only; installed-product acceptance is performed by a later step.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Linux test-only environment allowlist gateをRust試験
        if: ${{ inputs.acceptance_scope == 'agent_task_supervision' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path native/rust_helper/Cargo.toml \
            --lib --features linux-desktop-broker \
            frontend_environment_drops_credentials_and_loader_overrides
          cargo test --locked --manifest-path native/rust_helper/Cargo.toml \
            --lib --features linux-desktop-broker,r2-e2e \
            frontend_environment_drops_credentials_and_loader_overrides
          cargo test --locked --manifest-path native/rust_helper/Cargo.toml \
            --lib --features linux-desktop-broker \
            agent_cli_owner_summary_does_not_claim_another_platforms_boundary
          cargo test --locked --manifest-path native/rust_helper/Cargo.toml \
            --lib --features linux-desktop-broker,r2-e2e \
            agent_cli_owner_summary_does_not_claim_another_platforms_boundary
          printf '\n- Frontend environment allowlist: test-only settings are rejected by the normal Linux feature set and admitted only by the dedicated `r2-e2e` verification feature. Agent CLI Owner confirmation text is tested with both normal and verification feature sets.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Broker-shaped non-authority fixtureからLinux Release buildとportable launcher初回起動
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$D4P_EXPORT_ROOT/fixture"
          output_root="$D4P_EXPORT_ROOT/output"
          umask 077
          # RFC 8032 public test vector only; this key is deliberately public and never used by a product release.
          printf '%s' '302e020100300506032b6570042204209d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60' | xxd -r -p > "$D4P_EXPORT_ROOT/test-update-private.der"
          openssl pkey -inform DER -in "$D4P_EXPORT_ROOT/test-update-private.der" -pubout -outform DER -out "$D4P_EXPORT_ROOT/test-update-public.der"
          python3 tooling/tests/create_linux_update_catalog_fixture.py --private-key "$D4P_EXPORT_ROOT/test-update-private.der"
          git diff --exit-code -- tooling/tests/fixtures/linux-update-catalog/updates.json tooling/tests/fixtures/linux-update-catalog/linux-installed-catalog-display.pkg
          catalog_base_url="https://raw.githubusercontent.com/gatchimuchio/D4-POCKET/${GITHUB_SHA}/tooling/tests/fixtures/linux-update-catalog"
          python3 tooling/tests/create_linux_export_fixture.py \
            --output-dir "$fixture_root" \
            --update-trust-public-key-der "$D4P_EXPORT_ROOT/test-update-public.der" \
            --update-trust-base-url "$catalog_base_url"
          export_arguments=(
            --receipt "$fixture_root/d4_pocket_export_receipt.json"
            --manifest-file "$fixture_root/d4-pocket-app-11111111111111111111111111111111.json"
            --output-dir "$output_root"
            --allow-verification-branch
          )
          if [ '${{ inputs.acceptance_scope }}' = 'agent_task_supervision' ]; then
            export_arguments+=(--r2-e2e-test-build)
          fi
          python3 tooling/export_linux_product.py "${export_arguments[@]}"
          python3 tooling/package_linux_product.py \
            --source-dir "$output_root/bundle" \
            --output "$output_root/D4Pocket-linux-rollback.d4pkg" \
            --product-version 0.1.1
          python3 - "$output_root" "$(git rev-parse HEAD)" '${{ inputs.acceptance_scope }}' <<'PY' | tee "$D4P_EXPORT_ROOT/build-result.json"
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          evidence = json.loads((root / "d4_pocket_linux_export_build.json").read_text())
          package = root / "D4Pocket-linux.d4pkg"
          expected_test_build = sys.argv[3] == "agent_task_supervision"
          assert evidence["target_platform"] == "linux"
          assert evidence["source_commit"] == sys.argv[2]
          assert evidence["signed"] is False and evidence["formal_distribution_claimed"] is False
          assert evidence["package"]["installed_product_verified"] is False
          assert evidence["package"]["sha256"] == hashlib.sha256(package.read_bytes()).hexdigest()
          assert evidence["cmake_configure_arguments"].count(
              "-DD4_LINUX_R2_E2E_TEST_BUILD=ON" if expected_test_build
              else "-DD4_LINUX_R2_E2E_TEST_BUILD=OFF"
          ) == 1
          assert evidence["cmake_configure_arguments"].count(
              "-DD4_LINUX_R2_E2E_TEST_BUILD=ON" if not expected_test_build
              else "-DD4_LINUX_R2_E2E_TEST_BUILD=OFF"
          ) == 0
          print(json.dumps({"source_commit": evidence["source_commit"], "artifact_tree_sha256": evidence["artifact_tree_sha256"], "package_sha256": evidence["package"]["sha256"], "r2_e2e_test_build": expected_test_build, "signed": False, "installed_product_verified": False}, separators=(",", ":")))
          PY
          python3 -m unittest tooling.tests.test_linux_gtk_bundle_smoke
          python3 -m unittest tooling.tests.test_linux_installed_product_smoke
          python3 -m unittest tooling.tests.test_export_linux_product
          if [ '${{ inputs.acceptance_scope }}' != 'runtime_provenance' ]; then
            dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_gtk_bundle_smoke.py \
              --launcher "$output_root/bundle/gui_shell_desktop_launcher" \
              --temp-root "$D4P_EXPORT_ROOT" \
              --backend x11
            dbus-run-session -- python3 tooling/tests/linux_gtk_bundle_smoke.py \
              --launcher "$output_root/bundle/gui_shell_desktop_launcher" \
              --temp-root "$D4P_EXPORT_ROOT" \
              --backend wayland
          fi
          {
            printf '\n- Export evidence: `%s`\n' "$(cat "$output_root/d4_pocket_linux_export_build.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["artifact_tree_sha256"])')"
            printf -- '- Package hash: `%s`\n' "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["package"]["sha256"])' "$output_root/d4_pocket_linux_export_build.json")"
            printf -- '- Fixture: synthetic Broker-shaped Receipt／Manifest; no Owner authority or credentials.\n'
            if [ '${{ inputs.acceptance_scope }}' = 'runtime_provenance' ]; then
              printf -- '- Portable X11／Wayland smoke was skipped because this scope verifies the installed product provenance; previously accepted scopes are not replayed.\n'
            else
              printf -- '- Runtime smoke: portable product Rust launcher opened and normally closed its Flutter GTK window under Xvfb/X11; Wayland run used Weston headless/Pixman, verified the live launcher GTK process successfully connected to the isolated Wayland socket using external connect-syscall observation, then stopped the owned process group. No debug environment variable was required or forwarded through the frontend allowlist. Both used an initially absent XDG_DATA_HOME and verified cleanup.\n'
              printf -- '- Scope: portable first-launch, Linux GTK X11 window close, and Wayland socket-connect smoke only; the Wayland check does not prove surface rendering. This build is not signed Install/Owner activation, installed-version handoff, production compositor coverage, formal distribution, or runtime Manifest consumption.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 固定版Linux Codex CLIを検証rootへ取得
        if: ${{ inputs.acceptance_scope == 'agent_task_supervision' }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$D4P_EXPORT_ROOT/codex-cli-0.163.0-alpha.10.2-linux-x64"
          test ! -e "$package_dir"
          mkdir -m 0700 "$package_dir"
          curl --fail --location --output "$package_dir/package.tgz" https://registry.npmjs.org/@openai/codex/-/codex-0.163.0-alpha.10.2-linux-x64.tgz
          digest="$(openssl dgst -sha512 -binary "$package_dir/package.tgz" | openssl base64 -A)"
          test "$digest" = 'S3Om6e/GIhhheqWmc/aRCGM55ibvhnpYKq1gJ4bwCYeCNEtXEd7+L8xa5aX+JVmV0wL1oOFZi/R/R8iSLriHTA=='
          tar -xzf "$package_dir/package.tgz" -C "$package_dir"
          cli="$(find "$package_dir/package" -type f -name codex -print -quit)"
          test -n "$cli" && test -f "$cli"
          chmod 0700 "$cli"
          printf 'D4P_LINUX_TASK_CODEX_CLI=%s\n' "$cli" >> "$GITHUB_ENV"
          {
            printf '\n- Codex CLI interface source: pinned `@openai/codex 0.163.0-alpha.10.2 linux-x64` package, SHA-512 verified against the fixed digest. No API credential is installed or used.\n'
            printf -- '- The CLI runs only against the run-owned loopback Responses fixture in this workflow. The artifact is stored under the exact runner temporary root and removed by the existing final cleanup step.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: installed GTK UIでRollback／Export／Uninstallを受入れる
        if: ${{ inputs.acceptance_scope == 'update_lifecycle' }}
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
          D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE: ${{ runner.temp }}/d4p-linux-export-${{ github.run_id }}-${{ github.run_attempt }}/output/D4Pocket-linux-rollback.d4pkg
        run: |
          set -euo pipefail
          test_package="$D4P_EXPORT_ROOT/output/D4Pocket-linux.d4pkg"
          acceptance_root="$D4P_EXPORT_ROOT/installed-acceptance"
          dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_installed_product_smoke.py \
            --package "$test_package" \
            --temp-root "$D4P_EXPORT_ROOT" \
            --acceptance-root "$acceptance_root" \
            --private-key "$D4P_EXPORT_ROOT/test-update-private.der" \
            --update-package "$D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE"
          {
            printf '\n- Installed acceptance: the Release package passed Broker stage／activation with an RFC 8032 public test-vector Ed25519 candidate signature bound to its exact package hash, fixed XDG desktop entry validation, `gio launch` under X11, normal GTK window close, owned-process cleanup, and durable LIVE_RUNTIME startup／exit Audit reload. A second installed-entry launch ran with X11／XAUTHORITY removed under isolated Weston/Wayland; the GTK top-level was AT-SPI `SHOWING` and owned processes were stopped. This does not establish Wayland surface rendering, compositor coverage beyond Weston headless/Pixman, or production signing.\n'
            printf -- '- Test update trust: RFC 8032 published Ed25519 test vector. Only its public trust enters the synthetic export Manifest／product; the known test-only private vector is isolated under this run temporary root, passed only to the Rust acceptance seeder, never included in the installed app, and removed by exact-root cleanup. It is not a secret or production signing identity.\n'
            printf -- '- Rollback UI LIVE_RUNTIME: a second package from the exact same Release bundle was seeded as `0.1.1` over the installed `0.1.0`. The installed Update Center then downloaded／staged／activated the separate signed test candidate `0.1.2`; fresh native Owner rejection followed by a new approval for rollback switched `0.1.2` → `0.1.1`, preserving exact desktop-entry bytes and the already-running product process. Durable Broker Audit retains the operation decisions and evidence classes.\n'
            printf -- '- Export Owner boundary: the installed product UI activates the exact visible Export command via its exposed AT-SPI Tap action and sends Enter only after visible focus; native Owner Reject／Allow uses its verified GTK control. Reject creates no file; a new request plus Allow reaches the installed Rust Broker and creates a fresh Linux App／Audit identity Manifest. The file-backed Audit chain／anchor HMAC is LIVE_RUNTIME-reloaded; individual Export events retain their `INTERNAL_STATE` evidence classification.\n'
            printf -- '- Uninstaller LIVE_RUNTIME: after X11／Wayland launch checks, the installed UI opens Update Center and requests Uninstall. Native Owner rejection leaves the fixed product root, active-version record, desktop entry, and running process group intact. A separate Owner approval requests required application exit; the launcher consumes the one-time handoff, removes only the fixed product root／entry, and leaves a config sentinel plus the file-backed Audit Store and anchor outside that root. Both decisions and completion are checked in the chained Audit.\n'
            printf -- '- Update Center LIVE_RUNTIME: installed UI fetched the immutable-commit catalog and package from raw.githubusercontent.com over Broker-owned HTTPS; current Broker trust verified the Ed25519 candidate and exact package digest／length. Automated UI accepted separate download, stage, and activation native Owner dialogs, while each preceding rejection left package／stage／active record／desktop entry／running process unchanged. The resulting 0.1.2 test candidate was then Owner-rolled back to the runnable 0.1.1 release bundle. Audit contains the remote download LIVE_RUNTIME completion and durable stage／activation／rollback decisions.\n'
            printf -- '- The remote update package is a deliberately non-executable 1.8 KiB test-only Linux D4PKG fixture signed with the published RFC 8032 test key; it was never launched and is not a release payload. All UI actions use automated AT-SPI／keyboard input, not a human gesture. Scope: Ubuntu hosted Xvfb／X11 plus isolated Weston headless/Pixman Wayland session and test identity; Wayland surface rendering is not established. Not real desktop-session distribution coverage, production signing／publisher identity, Secret Service／MCP, Workspace selection, Agent Task recovery, production update artifact acceptance, or release readiness.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: installed GTK UIでSecret Service Credential Vaultを受入れる
        if: ${{ inputs.acceptance_scope == 'credential_vault' }}
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
          D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE: ${{ runner.temp }}/d4p-linux-export-${{ github.run_id }}-${{ github.run_attempt }}/output/D4Pocket-linux-rollback.d4pkg
        run: |
          set -euo pipefail
          test_package="$D4P_EXPORT_ROOT/output/D4Pocket-linux.d4pkg"
          acceptance_root="$D4P_EXPORT_ROOT/installed-credential-acceptance"
          dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_installed_product_smoke.py \
            --package "$test_package" \
            --temp-root "$D4P_EXPORT_ROOT" \
            --acceptance-root "$acceptance_root" \
            --private-key "$D4P_EXPORT_ROOT/test-update-private.der" \
            --update-package "$D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE" \
            --acceptance-scope credential_vault
          {
            printf '\n- Installed Credential acceptance: isolated unlocked run-owned GNOME Secret Service; installed GTK native masked-entry path; Owner reject produced no stored items; a distinct Owner allow created one metadata record and separate key／ciphertext items; normal installed-app exit／restart reloaded the same active metadata from durable Broker Audit; Owner reject／allow for logical revocation preserved the two Secret Service items; final metadata was revoked; Audit chain／anchor HMAC and test-secret non-exposure in UI／Audit／logs／acceptance files were checked.\n'
            printf -- '- Scope: Ubuntu 24.04 hosted Xvfb／X11, unsigned test-identity installed product and automated AT-SPI／keyboard input. This does not establish MCP child injection／Tool execution, Secret Service behavior in other Linux desktop sessions, Wayland rendering, production package signing／distribution, or full Linux product completion.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: installed GTK UIでMCP stdio childとToolを受入れる
        if: ${{ inputs.acceptance_scope == 'mcp_tool_execution' }}
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
          D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE: ${{ runner.temp }}/d4p-linux-export-${{ github.run_id }}-${{ github.run_attempt }}/output/D4Pocket-linux-rollback.d4pkg
        run: |
          set -euo pipefail
          test_package="$D4P_EXPORT_ROOT/output/D4Pocket-linux.d4pkg"
          acceptance_root="$D4P_EXPORT_ROOT/installed-mcp-acceptance"
          dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_installed_product_smoke.py \
            --package "$test_package" \
            --temp-root "$D4P_EXPORT_ROOT" \
            --acceptance-root "$acceptance_root" \
            --private-key "$D4P_EXPORT_ROOT/test-update-private.der" \
            --update-package "$D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE" \
            --acceptance-scope mcp_tool_execution
          {
            printf '\n- Installed MCP acceptance: a fresh native Owner rejection created no stdio child; a separate Owner approval launched the run-owned real `/usr/bin/python3` MCP fixture through the installed GTK Runner and production Broker. The fixture completed `server/discover`, `tools/list`, and one Owner-confirmed `tools/call`; the installed UI showed the LIVE_RUNTIME result hash, content type, and Audit receipt while the fixture result marker stayed absent from UI／Audit／logs／acceptance files. Disconnect rejection preserved the child group; a separate native Owner approval confirmed owned group termination and removed the Broker connection. The installed app then exited normally, and the file-backed Audit chain／anchor HMAC was checked.\n'
            printf -- '- Scope: Ubuntu 24.04 hosted Xvfb／X11, unsigned test-identity installed product, and automated AT-SPI／keyboard input. This proves the installed MCP stdio／Tool metadata and hash-only result path for a local synthetic server only; no external provider／credential injection, non-X11 desktop session, Wayland rendering, production signing／distribution, or full Linux product completion.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Linux Broker Workspace Inspector Owner経路をRust試験で確認
        if: ${{ inputs.acceptance_scope == 'workspace_selection' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path native/rust_helper/Cargo.toml --lib workspace_inspector -- --nocapture

      - name: installed GTK UIでWorkspace OS選択／secret boundaryを受入れる
        if: ${{ inputs.acceptance_scope == 'workspace_selection' }}
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
          D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE: ${{ runner.temp }}/d4p-linux-export-${{ github.run_id }}-${{ github.run_attempt }}/output/D4Pocket-linux-rollback.d4pkg
        run: |
          set -euo pipefail
          test_package="$D4P_EXPORT_ROOT/output/D4Pocket-linux.d4pkg"
          acceptance_root="$D4P_EXPORT_ROOT/installed-workspace-acceptance"
          dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_installed_product_smoke.py \
            --package "$test_package" \
            --temp-root "$D4P_EXPORT_ROOT" \
            --acceptance-root "$acceptance_root" \
            --private-key "$D4P_EXPORT_ROOT/test-update-private.der" \
            --update-package "$D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE" \
            --acceptance-scope workspace_selection
          {
            printf '\n- Installed Workspace acceptance: the GTK folder chooser selected the registered Workspace; cancellation preserved the prior field value; a native Owner rejection started no CLI probe; a separate Owner approval allowed only the bounded CLI interface probe and created a broker-process Workspace registration without Agent Task Permission／Approval.\n'
            printf -- '- Workspace Inspector required a separate native Owner read Approval. An allowed public file was visible; registered secret content, default secret path, and a symlink to content outside the Workspace were absent from the projection. Durable Audit chain／anchor HMAC, root／secret non-exposure, and test-root cleanup were checked.\n'
            printf -- '- Scope: Ubuntu 24.04 hosted Xvfb／X11, unsigned test-identity installed product, automated AT-SPI／keyboard and a run-owned interface-only Codex CLI fixture. This does not establish Wayland rendering, real desktop-session coverage, Agent Task execution／Recovery, formal signing／distribution, or full Linux product completion.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: installed GTK UIでAgent Task process／scratch supervisionを受入れる
        if: ${{ inputs.acceptance_scope == 'agent_task_supervision' && steps.codex_sandbox.outputs.available == 'true' }}
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
          D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE: ${{ runner.temp }}/d4p-linux-export-${{ github.run_id }}-${{ github.run_attempt }}/output/D4Pocket-linux-rollback.d4pkg
        run: |
          set -euo pipefail
          test_package="$D4P_EXPORT_ROOT/output/D4Pocket-linux.d4pkg"
          acceptance_root="$D4P_EXPORT_ROOT/installed-agent-task-acceptance"
          dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_installed_product_smoke.py \
            --package "$test_package" \
            --temp-root "$D4P_EXPORT_ROOT" \
            --acceptance-root "$acceptance_root" \
            --private-key "$D4P_EXPORT_ROOT/test-update-private.der" \
            --update-package "$D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE" \
            --acceptance-scope agent_task_supervision \
            --codex-cli "$D4P_LINUX_TASK_CODEX_CLI"
          {
            printf '\n- Installed Agent Task acceptance uses the real pinned Codex CLI interface against a run-owned loopback Responses fixture, without provider credentials or external model access. It exercises the installed GTK UI, native Owner confirmation, production Broker, one-use Workspace Permission and per-Task Approval, Linux process guardian, WorkspaceTaskScratch, Audit, and Task status.\n'
            printf -- '- Required cases: successful bounded Workspace write and normal scratch cleanup; active Task cancellation with descendant stop and scratch cleanup; Broker-enforced deadline with descendant stop, failed terminal state, and scratch cleanup. Secret canaries and outside-Workspace target remain denied; previous Approval is not reused.\n'
            printf -- '- This is a dedicated unsigned verification build with the fixed synthetic App/Audit identity. It is not a normal Release, distribution artifact, real-model result, Wayland GUI proof, or release-readiness claim.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: installed GTK UIからruntime provenanceを照合
        if: ${{ inputs.acceptance_scope == 'runtime_provenance' }}
        shell: bash
        env:
          GUI_SHELL_PRODUCT_APP_ID: d4-pocket-app-11111111111111111111111111111111
          GUI_SHELL_PRODUCT_AUDIT_STORE_ID: audit-store-22222222222222222222222222222222
          D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE: ${{ runner.temp }}/d4p-linux-export-${{ github.run_id }}-${{ github.run_attempt }}/output/D4Pocket-linux-rollback.d4pkg
        run: |
          set -euo pipefail
          test_package="$D4P_EXPORT_ROOT/output/D4Pocket-linux.d4pkg"
          acceptance_root="$D4P_EXPORT_ROOT/installed-runtime-provenance"
          result_path="$D4P_EXPORT_ROOT/installed-runtime-provenance.json"
          dbus-run-session -- xvfb-run -a python3 tooling/tests/linux_installed_product_smoke.py \
            --package "$test_package" \
            --temp-root "$D4P_EXPORT_ROOT" \
            --acceptance-root "$acceptance_root" \
            --private-key "$D4P_EXPORT_ROOT/test-update-private.der" \
            --update-package "$D4P_LINUX_ACCEPTANCE_UPDATE_PACKAGE" \
            --acceptance-scope runtime_provenance \
            --build-evidence "$D4P_EXPORT_ROOT/output/d4_pocket_linux_export_build.json" \
            --bundle-root "$D4P_EXPORT_ROOT/output/bundle" \
            --source-commit "$(git rev-parse HEAD)" | tee "$result_path"
          python3 - "$result_path" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          runtime = result["runtime_identity"]
          audit = result["audit_store_observation"]
          components = result["component_sha256"]
          print("\n### Installed runtime provenance (LIVE_RUNTIME)")
          print(f"- Source commit: `{result['source_commit']}`")
          print(f"- Package: `{result['package_sha256']}` ({result['package_byte_length']} bytes)")
          print(f"- Artifact tree: `{result['artifact_tree_sha256']}`; installed tree: `{result['installed_artifact_tree_sha256']}` ({result['artifact_count']} files)")
          print(f"- Installed root: `{result['installed_root']}`")
          print(f"- Active stage: `{result['active_stage']}`")
          print(f"- Runtime identity: App `{runtime['app_id']}`, Audit Store `{runtime['audit_store_id']}`")
          print(f"- Runner: `{components['runner']}`; Launcher: `{components['launcher']}`; Broker: `{components['broker']}`")
          print(f"- Live Runner: `{result['live_processes']['runner']['sha256']}` ({result['live_processes']['runner']['process_count']} process); live Broker: `{result['live_processes']['broker']['sha256']}` ({result['live_processes']['broker']['process_count']} process)")
          print(f"- Audit Store path: `{audit['path']}`; Audit file `{audit['audit.jsonl']['sha256']}`; anchor `{audit['audit_anchor.json']['sha256']}`; private key file present: `{audit['anchor_key_private_file']}`")
          print("- Scope: Ubuntu 24.04 hosted Xvfb/X11, unsigned synthetic test identity. This binds the installed artifacts and current runtime paths to this source commit; it does not establish a real desktop session, Wayland rendering, signing, formal distribution, or Linux-wide release readiness.")
          PY

      - name: failure-only GTK Workspace chooser screenshot
        if: ${{ failure() && inputs.acceptance_scope == 'workspace_selection' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-workspace-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/d4p-linux-export-${{ github.run_id }}-${{ github.run_attempt }}/workspace-chooser-*.png
            ${{ runner.temp }}/d4p-linux-export-${{ github.run_id }}-${{ github.run_attempt }}/workspace-inspector-*.png
          if-no-files-found: ignore
          retention-days: 1

      - name: build fixture／bundleを正確な一時rootから削除
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected_root="$RUNNER_TEMP/d4p-linux-export-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -z "${D4P_EXPORT_ROOT:-}" ] || [ "$D4P_EXPORT_ROOT" != "$expected_root" ]; then
            echo '一時rootがこのrunの正確な所有pathではない'
            exit 1
          fi
          if [ -L "$D4P_EXPORT_ROOT" ]; then
            echo '一時rootがsymlink'
            exit 1
          fi
          if [ -e "$D4P_EXPORT_ROOT" ]; then
            rm -rf -- "$D4P_EXPORT_ROOT"
          fi
          test ! -e "$D4P_EXPORT_ROOT"
