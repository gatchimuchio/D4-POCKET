name: Android手動補助build・native Device Link LIVE_RUNTIME

'on': workflow_dispatch

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 対象commitを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 実行環境と対象を記録
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            git rev-parse HEAD
            uname -a
            free -b
            df -B1 .
            ls -l /dev/kvm
          } | tee evidence/environment.txt
          test -d "${JAVA_HOME_17_X64:?}"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/gui-shell-avd" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          # 隔離runnerの実行利用者だけに仮想端末用KVM accessを限定する。
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          getfacl /dev/kvm > evidence/kvm-access.txt
      - name: 固定Flutterを導入
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version | tee evidence/flutter.txt
      - name: 実TLS接続用のRust helperと参照Runtimeを準備
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 build --locked --manifest-path native/rust_helper/Cargo.toml 2>&1 | tee evidence/rust-build.txt
          cargo +1.95.0 test --locked --manifest-path native/rust_helper/Cargo.toml --lib broker::update_download::tests::unix更新保管先とpackageのsymbolic_linkを拒否する -- --exact 2>&1 | tee evidence/rust-unix-package-boundary.txt
          git clone https://github.com/gatchimuchio/NOTNN-LLM-MINIDORA.git "$RUNNER_TEMP/minidora-reference"
          git -C "$RUNNER_TEMP/minidora-reference" checkout --detach 3400a3bb68b37efa1dc14ee8aaa28fda779bf1f8
      - name: Android仮想端末を準備
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          "$sdkmanager" --list_installed > evidence/sdk-installed-before.txt
          # 固定Flutterの要求NDKを照合し、専用runnerの未使用版だけを標準工具で除く。
          grep -F 'val ndkVersion: String = "28.2.13676358"' "$RUNNER_TEMP/flutter/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          grep -F 'ndkVersion = flutter.ndkVersion' apps/mobile_flutter/android/app/build.gradle.kts
          "$sdkmanager" --uninstall "ndk;27.3.13750724" "ndk;29.0.14206865" </dev/null 2>&1 | tee evidence/sdk-unused-ndk-removal.txt
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          # Android 17 / API 37 is preview-only; the current repository exposes its base platform as 37.0.
          "$sdkmanager" "platforms;android-37.0" --channel=3 </dev/null 2>&1 | tee evidence/sdk-preview-platform-install.txt
          "$sdkmanager" "emulator" "system-images;android-35;google_apis;x86_64" </dev/null 2>&1 | tee evidence/sdk-install.txt
          "$sdkmanager" --list_installed > evidence/sdk-installed.txt
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tee evidence/emulator-acceleration.txt
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$avdmanager" create avd --name gui_shell_native_test --path "$ANDROID_AVD_HOME/gui_shell_native_test.avd" --package 'system-images;android-35;google_apis;x86_64'
          test -f "$ANDROID_AVD_HOME/gui_shell_native_test.ini"
          cp "$ANDROID_AVD_HOME/gui_shell_native_test.avd/config.ini" evidence/avd-config-effective.txt
          df -B1 "$ANDROID_AVD_HOME" > evidence/emulator-disk-before.txt
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee evidence/configured-avds.txt
          grep -Fx gui_shell_native_test evidence/configured-avds.txt
      - name: Flutter検査・Android build・native Device Link製品経路を確認
        shell: bash
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/emulator/emulator" -avd gui_shell_native_test -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -cores 2 > evidence/emulator.txt 2>&1 &
          emulator_pid=$!
          cleanup() {
            timeout 10 "$adb" -s emulator-5554 emu kill || true
            kill "$emulator_pid" 2>/dev/null || true
            for attempt in $(seq 1 10); do
              if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            kill -KILL "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" || true
          }
          trap cleanup EXIT
          timeout 180 "$adb" -s emulator-5554 wait-for-device
          deadline=$((SECONDS + 180))
          while [ "$(timeout 5 "$adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" != 1 ]; do
            kill -0 "$emulator_pid"
            test "$SECONDS" -lt "$deadline"
            sleep 2
          done
          test "$(timeout 10 "$adb" -s emulator-5554 shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          timeout 10 "$adb" -s emulator-5554 emu avd name | tr -d '\r' | tee evidence/avd-name.txt
          grep -Fx gui_shell_native_test evidence/avd-name.txt
          timeout 10 "$adb" -s emulator-5554 shell getprop ro.build.fingerprint > evidence/android-fingerprint.txt
          cd apps/mobile_flutter
          flutter pub get 2>&1 | tee ../../evidence/mobile-pub-get.txt
          flutter analyze --no-pub 2>&1 | tee ../../evidence/mobile-analyze.txt
          flutter test --no-pub --reporter expanded 2>&1 | tee ../../evidence/mobile-test.txt
          flutter build apk --debug --no-pub 2>&1 | tee ../../evidence/android-apk-build.txt
          flutter build appbundle --debug --no-pub 2>&1 | tee ../../evidence/android-appbundle-build.txt
          timeout 60 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 install -r build/app/outputs/flutter-apk/app-debug.apk 2>&1 | tee ../../evidence/android-install.txt
          timeout 30 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell am start -W -n com.example.gui_shell_mobile/.MainActivity 2>&1 | tee ../../evidence/android-start.txt
          # Android版差による前景Activity項目名の差を許容し、画面状態と起動中processを別々に記録する。
          deadline=$((SECONDS + 60))
          while true; do
            timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell dumpsys activity activities | tr -d '\r' | tee ../../evidence/android-activities.txt > /dev/null
            grep -E 'mResumedActivity|topResumedActivity|Resumed(Activity)?:' ../../evidence/android-activities.txt | grep -F 'com.example.gui_shell_mobile' > ../../evidence/android-resumed.txt || true
            timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell pidof com.example.gui_shell_mobile > ../../evidence/android-process.txt || true
            if [ -s ../../evidence/android-resumed.txt ] && [ -s ../../evidence/android-process.txt ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 logcat -d -t 1000 -s AndroidRuntime:E > ../../evidence/android-runtime-errors.txt || true
              echo 'Android前景画面とprocessの確認期限を超過' >&2
              exit 1
            fi
            sleep 2
          done
          cd ../..
          python3 tooling/minidora_live_check.py --reference "$RUNNER_TEMP/minidora-reference" --mobile-client 2>&1 | tee evidence/device-link-rust-live-test.txt
          python3 tooling/minidora_live_check.py --reference "$RUNNER_TEMP/minidora-reference" --android-native --android-serial emulator-5554 2>&1 | tee evidence/android-native-device-link-live-test.txt
      - name: 追跡差分を検査
        shell: bash
        run: |
          set -euo pipefail
          git status --short > evidence/build-working-tree.txt
          git diff --binary > evidence/build-migrations.patch
          git diff --exit-code
          git diff --cached --exit-code
      - name: 補助証拠をアップロード
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-emulator-${{ github.sha }}
          path: evidence/
          retention-days: 3
          if-no-files-found: error
