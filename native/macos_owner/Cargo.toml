[package]
name = "gui_shell_macos_owner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.186"
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSResponder", "NSOpenPanel", "NSPanel", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSData", "NSArray", "NSError"] }
