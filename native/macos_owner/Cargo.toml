[package]
name = "gui_shell_macos_owner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSResponder", "NSOpenPanel", "NSPanel", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
