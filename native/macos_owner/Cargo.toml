[package]
name = "gui_shell_macos_owner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
credential-ui-fixture = ["dep:getrandom"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "=1.9.0"
getrandom = { version = "=0.2.17", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.186"
block2 = "=0.6.2"
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSResponder", "NSOpenPanel", "NSPanel", "NSSavePanel", "NSWindow", "NSAlert", "NSSecureTextField", "NSTextField", "NSControl", "NSView", "NSButton"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSString", "NSURL", "NSData", "NSArray", "NSError", "NSTimer"] }
