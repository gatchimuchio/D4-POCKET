[package]
name = "gui_shell_rust_helper"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "gui_shell_rust_helper"
path = "src/lib.rs"

[dependencies]
getrandom = "0.2"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

rustls = { version = "0.23.44", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = "0.14.10"
subtle = "2.6.1"

ring = "0.17.14"
