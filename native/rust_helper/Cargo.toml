[package]
name = "gui_shell_rust_helper"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
# Local-only integrated R2 test build. Never use for product distribution.
r2-e2e = []

[lib]
name = "gui_shell_rust_helper"
path = "src/lib.rs"

[[bin]]
name = "gui_shell_r2_e2e_responses"
path = "src/bin/r2_e2e_responses.rs"
required-features = ["r2-e2e"]

[[bin]]
name = "gui_shell_r2_e2e_frontend"
path = "src/bin/r2_e2e_frontend.rs"
required-features = ["r2-e2e"]

[dependencies]
getrandom = "0.2"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "=0.58.1", default-features = false }
unicode-normalization = "0.1"
regex = "1.12.2"

rustls = { version = "0.23.44", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = "0.14.10"
subtle = "2.6.1"
zeroize = "=1.9.0"

ring = "0.17.14"

# Broker-owned HTTPS update downloads; async transfer stays on one dedicated worker.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"] }

cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"

[target.'cfg(target_os = "macos")'.dependencies]
gui_shell_macos_owner = { path = "../macos_owner" }
gui_shell_macos_keychain = { path = "../macos_keychain" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
gui_shell_windows_broker_channel = { path = "../windows_broker_channel" }
gui_shell_windows_protection = { path = "../windows_protection" }
gui_shell_windows_runtime_observation = { path = "../windows_runtime_observation" }
winsafe = { version = "=0.0.29", default-features = false, features = ["advapi", "kernel", "psapi", "shell", "user"] }
gui_shell_windows_dns = { path = "../windows_dns" }
gui_shell_process_supervision = { path = "../process_supervision" }
